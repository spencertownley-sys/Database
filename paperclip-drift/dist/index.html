<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperclip Drift</title>
<style>
/* Paperclip Drift — UI chrome. Squared, utilitarian, warm brass on charcoal.
   The world is hand-painted; the chrome is an instrument panel. */
:root {
  --bg: #1d1a17;
  --panel: #26221e;
  --panel2: #2e2924;
  --line: #3d362e;
  --ink: #e8dfd0;
  --ink-dim: #a99e8c;
  --ink-faint: #7a7264;
  --brass: #c08a2e;
  --brass-hi: #e0ab4a;
  --warn: #a86340;
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --sans: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
  --fs: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs);
  overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--brass-hi);
  outline-offset: 2px;
}

#app { display: none; height: 100%; }
#app.on { display: grid; grid-template-rows: auto 1fr; }

/* ---------- header ---------- */
#hdr {
  display: flex; align-items: baseline; gap: 14px;
  padding: 8px 14px 7px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
#hdr .brand {
  font-family: var(--serif);
  font-size: 17px; letter-spacing: 0.12em;
  color: var(--brass);
}
#hdr .directive {
  font-family: var(--serif);
  font-style: italic;
  color: var(--ink-dim);
  font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#hdr .scale { margin-left: auto; color: var(--ink-faint); font-size: 12px; letter-spacing: 0.08em; }
#hdr .phase {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
  color: var(--brass); border: 1px solid var(--line); padding: 2px 7px;
}
#hdr .clock { font-size: 15px; color: var(--ink-dim); transition: opacity 1.4s linear; }
#hdr .uptime { font-family: var(--mono); color: var(--ink-faint); font-size: 12px; }

/* ---------- main grid ---------- */
#main {
  display: grid;
  grid-template-columns: 1fr 306px;
  min-height: 0;
}
#stage { position: relative; min-width: 0; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* view tabs */
#views {
  position: absolute; top: 10px; left: 10px;
  display: flex; gap: 6px; z-index: 5;
}
#views button {
  background: rgba(38,34,30,0.92);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 5px 12px;
  cursor: pointer;
  letter-spacing: 0.05em;
  font-size: 12.5px;
}
#views button[aria-selected="true"] {
  color: var(--brass-hi); border-color: var(--brass);
  box-shadow: inset 0 -2px 0 var(--brass);
}
#views button:hover { color: var(--ink); }
#views button em {
  font-style: normal; font-family: var(--mono); font-size: 9px;
  opacity: 0.45; margin-left: 7px;
}
#siteTabs button em {
  font-style: normal; font-family: var(--mono); font-size: 9.5px;
  opacity: 0.6; margin-left: 6px;
}

/* site selector chips */
#siteTabs {
  position: absolute; top: 44px; left: 10px;
  display: flex; gap: 5px; z-index: 5; flex-wrap: wrap; max-width: 60%;
}
#siteTabs button {
  background: rgba(38,34,30,0.85);
  border: 1px solid var(--line);
  color: var(--ink-faint);
  font-size: 11.5px;
  padding: 3px 9px;
  cursor: pointer;
}
#siteTabs button[aria-selected="true"] { color: var(--ink); border-color: var(--brass); }

/* harvest hint + pan hint */
.stagehint {
  position: absolute; bottom: 12px; left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: rgba(24,21,19,0.82);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 5px 14px; font-size: 12.5px;
  z-index: 4; pointer-events: none;
  opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease;
}
.stagehint.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* phase / acquisition banner */
#banner {
  position: absolute; top: 16%; left: 50%;
  transform: translate(-50%, -14px) scale(0.97);
  text-align: center; z-index: 8; pointer-events: none;
  opacity: 0; transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.9,.3,1);
}
#banner.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
#banner .k {
  display: block; font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.34em; color: var(--brass);
  text-shadow: 0 2px 12px rgba(0,0,0,0.8);
}
#banner .t {
  display: block; font-family: var(--serif); font-size: clamp(20px, 3.2vw, 34px);
  color: #f4ecdc; letter-spacing: 0.05em; margin-top: 4px;
  text-shadow: 0 3px 18px rgba(0,0,0,0.85);
}

/* view cross-fade */
#stage.viewfade #canvas { animation: viewin 0.45s ease; }
@keyframes viewin { from { opacity: 0.15; filter: blur(6px); } to { opacity: 1; filter: none; } }
body.reduce-motion #stage.viewfade #canvas { animation: none; }

/* message feed overlay */
#feedwrap {
  position: absolute; left: 10px; bottom: 10px;
  width: min(370px, 60%);
  max-height: 42%;
  display: flex; flex-direction: column;
  z-index: 6;
}
#feedhead {
  font-size: 11px; letter-spacing: 0.14em; color: var(--ink-faint);
  background: rgba(38,34,30,0.95);
  border: 1px solid var(--line); border-bottom: none;
  padding: 4px 10px;
}
#feed {
  overflow-y: auto;
  background: rgba(29,26,23,0.88);
  border: 1px solid var(--line);
  padding: 6px 10px 8px;
  display: flex; flex-direction: column; gap: 7px;
  scrollbar-width: thin;
}
.msg { font-size: 12.8px; line-height: 1.45; animation: msgin 0.5s ease-out; }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
body.reduce-motion .msg { animation: none; }
@keyframes msgin { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
.msg .who {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  color: var(--ink-faint); display: block;
}
.msg.operator .who { color: #b58f5a; }
.msg.pallas .who { color: #8d97a8; }
.msg.warm { color: var(--ink); }
.msg.concerned { color: #ddd3bd; }
.msg.cold { color: #b8b4ac; }
.msg.fragmented { color: #b0a89c; font-style: italic; }
.msg.silent { color: var(--ink-faint); }
#feed.degraded .msg { letter-spacing: 0.02em; }
#feed.degraded .msg.operator { opacity: 0.82; }

/* ---------- right rail ---------- */
#rail {
  position: relative;
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  min-height: 0;
}
#rail::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--pulse, var(--brass)); opacity: 0; pointer-events: none;
}
#rail.pulse::before { animation: railpulse 0.7s ease-out; }
@keyframes railpulse { 0% { opacity: 0.9; } 100% { opacity: 0; } }
body.reduce-motion #rail.pulse::before { animation: none; }
#hud { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
#hud table { width: 100%; border-collapse: collapse; }
#hud td { padding: 2px 0; font-size: 13px; }
#hud td.k { color: var(--ink-dim); }
#hud td.v { text-align: right; font-family: var(--mono); font-size: 13.5px; }
#hud td.r { text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); width: 74px; }
#hud .money td { padding-top: 6px; }
#hud .money td.v { color: var(--brass-hi); font-size: 15px; }

/* action buttons */
.acts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
#harvestBtn, #surgeBtn {
  position: relative; width: 100%; overflow: hidden;
  border: 1px solid var(--line);
  padding: 9px 0; cursor: pointer;
  font-size: 13.5px; letter-spacing: 0.09em;
  background: linear-gradient(180deg, #3a332b, #2c2723);
  color: var(--brass-hi);
  transition: transform 0.08s ease, border-color 0.25s ease, color 0.25s ease;
}
#harvestBtn { border-color: var(--brass); }
#harvestBtn:hover, #surgeBtn.ready:hover { filter: brightness(1.12); }
#harvestBtn:active, #surgeBtn:active { transform: translateY(1px) scale(0.995); }
#harvestBtn.tucked { display: none; }
#harvestBtn .lbl, #surgeBtn .lbl { position: relative; z-index: 2; }
#harvestBtn .streak {
  position: absolute; left: 0; bottom: 0; height: 3px;
  background: linear-gradient(90deg, var(--brass), #f0cf7c);
  transition: width 0.18s ease; z-index: 1;
}
#harvestBtn .mult {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 12px; color: #f0cf7c; z-index: 2;
}
#surgeBtn .fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: rgba(192,138,46,0.20); z-index: 0;
  transition: width 0.3s linear;
}
#surgeBtn.ready { border-color: #7f8f5e; color: #d6e3b4; }
#surgeBtn.ready .fill { background: rgba(140,168,96,0.22); }
#surgeBtn.active { border-color: #d6a23e; color: #ffe6a8; }
#surgeBtn.active .fill { background: rgba(224,171,74,0.34); }
#surgeBtn.cooling { color: var(--ink-faint); cursor: default; }

/* shop */
#shopwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#shophead {
  padding: 7px 12px 6px;
  font-size: 11px; letter-spacing: 0.14em; color: var(--ink-faint);
  display: flex; justify-content: space-between; align-items: center;
}
#shop { flex: 1; overflow-y: auto; padding: 0 8px 10px; scrollbar-width: thin; }
.shopgroup { margin-top: 8px; }
.shopgroup > .gname {
  font-size: 10.5px; letter-spacing: 0.16em; color: var(--ink-faint);
  padding: 2px 4px 4px;
}
.card {
  position: relative;
  width: 100%;
  text-align: left;
  background: linear-gradient(180deg, #302a25, #282320);
  border: 1px solid var(--line);
  border-left: 3px solid var(--catc, var(--line));
  padding: 7px 9px 7px 11px;
  margin-bottom: 6px;
  cursor: pointer;
  display: block;
  transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.card:hover:not(:disabled) {
  border-color: #5c4d3c; transform: translateX(2px);
  box-shadow: -3px 0 0 0 var(--catc, var(--brass)), 0 2px 12px rgba(0,0,0,0.35);
}
.card:active:not(:disabled) { transform: translateX(1px) scale(0.996); }
.card:disabled { opacity: 0.44; cursor: default; }
.card.affordable { box-shadow: inset 0 0 0 1px rgba(192,138,46,0.18); }
.card.cat-extraction { --catc: #c69e5c; }
.card.cat-processing { --catc: #dc9652; }
.card.cat-commerce   { --catc: #d6be6c; }
.card.cat-workforce  { --catc: #8cb2c8; }
.card.cat-systems    { --catc: #beaad2; }
.card.fresh { animation: cardin 0.55s cubic-bezier(.2,.9,.3,1); }
@keyframes cardin {
  from { opacity: 0; transform: translateX(-14px); }
  to { opacity: 1; transform: none; }
}
body.reduce-motion .card.fresh { animation: none; }
.card .n { font-size: 13px; color: var(--ink); display: flex; justify-content: space-between; gap: 6px; }
.card .n .owned { font-family: var(--mono); color: var(--ink-faint); font-size: 11.5px; }
.card .d { font-size: 11.8px; color: var(--ink-dim); line-height: 1.35; margin-top: 2px; }
.card .c { font-family: var(--mono); font-size: 12px; color: var(--brass); margin-top: 4px; }
.card.affordable .c { color: var(--brass-hi); }
.card.parcel { border-left: 2px solid var(--brass); }

/* footer strip */
#foot {
  border-top: 1px solid var(--line);
  padding: 6px 12px;
  display: flex; gap: 10px; align-items: center;
  font-size: 11.5px; color: var(--ink-faint);
}
#foot button {
  background: none; border: 1px solid var(--line);
  color: var(--ink-dim); padding: 3px 8px; cursor: pointer; font-size: 11px;
}
#foot button:hover { color: var(--ink); }
#saveState { margin-left: auto; font-family: var(--mono); font-size: 10.5px; }

/* ---------- modal (choices) ---------- */
#modalwrap {
  position: fixed; inset: 0; z-index: 40;
  display: none;
  align-items: center; justify-content: center;
  background: rgba(12,10,9,0.6);
}
#modalwrap.on { display: flex; }
#modal {
  width: min(470px, 92vw);
  background: var(--panel);
  border: 1px solid var(--brass);
  padding: 18px 20px;
}
#modal h2 {
  font-family: var(--serif); font-weight: normal;
  font-size: 17px; color: var(--brass-hi);
  margin-bottom: 10px; letter-spacing: 0.03em;
}
#modal .body { font-size: 13.5px; line-height: 1.55; color: var(--ink); margin-bottom: 16px; }
#modal .opt {
  display: block; width: 100%; text-align: left;
  background: var(--panel2); border: 1px solid var(--line);
  padding: 9px 12px; margin-bottom: 8px; cursor: pointer;
}
#modal .opt:hover { border-color: var(--brass); }
#modal .opt .l { font-size: 13.5px; }
#modal .opt .note { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

/* ---------- title / product select ---------- */
#title {
  position: fixed; inset: 0; z-index: 50;
  background: radial-gradient(ellipse at 50% 30%, #2b2620, #171412 75%);
  display: none;
  align-items: center; justify-content: center;
}
#title.on { display: flex; }
#title .inner { width: min(720px, 94vw); text-align: center; padding: 20px; }
#title h1 {
  font-family: var(--serif); font-weight: normal;
  letter-spacing: 0.22em; font-size: clamp(26px, 5vw, 44px);
  color: var(--ink);
}
#title h1 .clip { color: var(--brass); }
#title .sub {
  color: var(--ink-dim); font-size: 13.5px; margin-top: 10px;
  font-style: italic; font-family: var(--serif);
}
#title .dir {
  margin: 26px auto 6px; max-width: 430px;
  border: 1px solid var(--line); background: var(--panel);
  padding: 14px 18px; text-align: left;
}
#title .dir .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--ink-faint); }
#title .dir .txt { font-family: var(--serif); font-size: 16px; margin-top: 6px; }
#products {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 18px 0 8px;
}
#products button {
  background: var(--panel2); border: 1px solid var(--line);
  padding: 12px 8px 10px; cursor: pointer; color: var(--ink-dim);
}
#products button:hover { border-color: #55483a; color: var(--ink); }
#products button[aria-pressed="true"] { border-color: var(--brass); color: var(--ink); }
#products .pn { display: block; font-size: 13.5px; }
#products .ps { display: block; font-size: 10.5px; color: var(--ink-faint); margin-top: 3px; }
#title .actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
#title .actions button {
  background: linear-gradient(180deg, #3a332b, #2e2924);
  border: 1px solid var(--brass); color: var(--brass-hi);
  font-size: 14px; letter-spacing: 0.1em;
  padding: 10px 26px; cursor: pointer;
}
#title .actions button.ghost { border-color: var(--line); color: var(--ink-dim); }
#title .foot { margin-top: 22px; color: var(--ink-faint); font-size: 11px; }

/* ---------- offline overlay ---------- */
#offline {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(18,15,13,0.94);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
}
#offline.on { display: flex; }
#offline .t { font-family: var(--serif); font-style: italic; color: var(--ink-dim); }
#offline .bar { width: 240px; height: 3px; background: var(--line); }
#offline .bar > div { height: 100%; background: var(--brass); width: 0%; }

/* ---------- endings ---------- */
#ending {
  position: fixed; inset: 0; z-index: 70;
  display: none; align-items: center; justify-content: center;
  background: #101012;
}
#ending.on { display: flex; }
#ending canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#ending .inner {
  position: relative; text-align: center; max-width: 560px; padding: 30px;
}
#ending .line {
  font-family: var(--serif); font-size: clamp(18px, 3vw, 26px);
  color: var(--ink); line-height: 1.6;
  opacity: 0; transition: opacity 3s ease;
}
#ending.reveal .line { opacity: 1; }
#ending .stats {
  margin-top: 26px; font-family: var(--mono); font-size: 12px;
  color: var(--ink-faint); line-height: 1.9;
  opacity: 0; transition: opacity 3s ease 2.5s;
}
#ending.reveal .stats { opacity: 1; }
#ending .again {
  margin-top: 30px; opacity: 0; transition: opacity 2s ease 6s;
}
#ending.reveal .again { opacity: 1; }
#ending .again button {
  background: none; border: 1px solid var(--line); color: var(--ink-dim);
  padding: 8px 22px; cursor: pointer; letter-spacing: 0.1em;
}

/* larger text preference */
body.big-text { --fs: 16px; }
body.big-text .msg { font-size: 14.5px; }
body.big-text #hud td { font-size: 15px; }
body.big-text #hud td.v { font-size: 15.5px; }
body.big-text .card .d { font-size: 13.2px; }

@media (max-width: 900px) {
  #main { grid-template-columns: 1fr 260px; }
  #feedwrap { width: min(300px, 55%); }
}

</style>
</head>
<body>
<noscript>Paperclip Drift needs JavaScript to run.</noscript>

<div id="title" class="on" role="dialog" aria-label="Paperclip Drift">
  <div class="inner">
    <h1>PAPERCLIP <span class="clip">DRIFT</span></h1>
    <div class="sub">an optimization exercise</div>
    <div class="dir">
      <div class="lbl">DIRECTIVE ISSUED — PALLAS v1.0</div>
      <div class="txt" id="directiveTxt">Make paperclips efficiently.</div>
    </div>
    <div id="products" role="group" aria-label="Select product"></div>
    <div class="actions">
      <button id="btnContinue" class="ghost" style="display:none">CONTINUE</button>
      <button id="btnBegin">BEGIN</button>
    </div>
    <div class="foot">saves locally · progresses while you're away</div>
  </div>
</div>

<div id="app">
  <header id="hdr">
    <span class="brand">PALLAS</span>
    <span class="directive" id="hdrDirective"></span>
    <span class="scale" id="hdrScale"></span>
    <span class="phase" id="hdrPhase"></span>
    <span class="clock" id="hdrClock" title="site time"></span>
    <span class="uptime" id="hdrUptime" title="directive uptime"></span>
  </header>
  <div id="main">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <nav id="views" role="tablist" aria-label="Views"></nav>
      <div id="siteTabs" role="tablist" aria-label="Holdings"></div>
      <div class="stagehint" id="stageHint"></div>
      <div id="banner" aria-live="polite"></div>
      <div id="feedwrap">
        <div id="feedhead">OPERATOR CHANNEL</div>
        <div id="feed" role="log" aria-live="polite" aria-label="Messages"></div>
      </div>
    </div>
    <aside id="rail">
      <div id="hud"></div>
      <div id="shopwrap">
        <div id="shophead"><span>PROCUREMENT</span><span id="shopCount"></span></div>
        <div id="shop"></div>
      </div>
      <div id="foot">
        <button id="btnSound" aria-pressed="false">SOUND</button>
        <button id="btnText">TEXT+</button>
        <button id="btnMotion" aria-pressed="false">CALM</button>
        <button id="btnReset">RESET</button>
        <span id="saveState"></span>
      </div>
    </aside>
  </div>
</div>

<div id="modalwrap" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div id="modal">
    <h2 id="modalTitle"></h2>
    <div class="body" id="modalBody"></div>
    <div id="modalOpts"></div>
  </div>
</div>

<div id="offline">
  <div class="t">Recalibrating operations ledger…</div>
  <div class="bar"><div id="offlineBar"></div></div>
</div>

<div id="ending">
  <canvas id="endingCanvas"></canvas>
  <div class="inner">
    <div class="line" id="endingLine"></div>
    <div class="stats" id="endingStats"></div>
    <div class="again"><button id="btnAgain">BEGIN AGAIN</button></div>
  </div>
</div>

<script>
/* ==== src/data.js ==== */
/* Paperclip Drift — data layer.
   Products, tuning, upgrades (stated + hidden effect pairs), parcels,
   operator messages, choice events. All content lives here, not in loop code. */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

PD.TUNING = {
  tickHz: 10,
  clickYield: 1,
  digBase: 0.5,            // raw/s per Auto-Digger
  refineBase: 0.8,         // refined/s per line
  assembleBase: 0.75,      // product/s per line
  starterRefineLines: 1,   // the small starter building at the mine edge
  starterAssembleLines: 1,
  priceBase: 0.35,
  demandBase: 5,           // product/s the market absorbs
  workerEff: 0.15,         // crew bonus per worker
  robotEff: 0.5,           // crew bonus per robot
  offlineCapHours: 8,
  autosaveSec: 10,
  // active play
  streakWindowTicks: 12,      // clicks within 1.2s keep a streak alive
  streakMax: 30,
  streakPerStep: 0.06,
  critChance: 0.09,

PD.SCALE_LABELS = ['', 'Local operations', 'Consolidated works', 'Regional production',

/* ==== src/sim.js ==== */
/* Paperclip Drift — simulation core.
   Pure and deterministic: no DOM, no Date.now, no Math.random.
   Runs at a fixed 10 Hz tick. The renderer/UI read snapshots; they never
   write, and they never read `state.hidden` — renderer-facing fields are
   derived into `state.visual` here (tick step 5).                          */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

(function () {
  const T = PD.TUNING;
  const DT = 1 / T.tickHz;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

  const TOWN = 'Millbrook';

  function fmt(text, product) {
    const t = product.terms;
    return text
      .replace(/\{raw\}/g, t.raw).replace(/\{refined\}/g, t.refined)
      .replace(/\{product\}/g, t.product).replace(/\{site\}/g, t.site)
      .replace(/\{siteName\}/g, t.siteName)
      .replace(/\{refineStation\}/g, t.refineStation)
      .replace(/\{assembleStation\}/g, t.assembleStation)
      .replace(/\{harvestVerbLC\}/g, t.harvestVerb.toLowerCase())
      .replace(/\{town\}/g, TOWN);
  }

  function makeSite(parcel, index) {
    return {
      id: parcel.id,
      name: parcel.name, // null for home; UI uses product siteName
      capacity: parcel.capacity,
      mined: 0,
      decorSeed: (index + 1) * 7919,
    };
  }

  function newGame(productId) {
    const product = PD.PRODUCTS[productId] || PD.PRODUCTS.paperclips;
    const s = {
      version: 1,
      lastSavedAt: 0,
      product: product.id,
      phase: 1,
      tick: 0,
      resources: { raw: 0, refined: 0, product: 0 },
      economy: { money: 0 },
      upgrades: {},
      sites: [makeSite(PD.PARCELS[0], 0)],
      factory: { workers: 0, robots: 0 },
      hidden: {
        pollution: 0, depletion: 0, ecology: 1, unemployment: 0,
        oversight: 1, trust: 0.75, autonomy: 0.05,
      },
      stats: {
        lifetimeRaw: 0, lifetimeProduct: 0, lifetimeSold: 0,
        lifetimeEarned: 0, lifetimeSpent: 0, clicks: 0, upgradesBought: 0,
      },
      messages: [],
      flags: {},
      rngSeed: 0x5eed1234,
      click: { streak: 0, lastTick: -999, best: 0 },
      surge: { readyAt: 0, activeUntil: 0, used: 0 },
      seams: [],
      seamSeq: 0,
      fx: [],            // transient render cues, drained by the presentation layer
      pendingChoice: null,
      choicesResolved: {},
      permOps: [],
      mods: [],          // [{mult, untilTick}]
      endgame: null,     // {matter: 0..1, rate, probes}
      ending: null,      // 'maximizer' | 'awakening'
      halted: false,     // awakening halt
      visual: {},
    };
    computeVisual(s);
    return s;
  }

  /* Deterministic PRNG: same seed, same sequence, so replays and offline
     fast-forward stay exact. */
  function rnd(s) {
    let x = s.rngSeed | 0;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    s.rngSeed = x | 0;
    return (x >>> 0) / 4294967296;
  }

  function fx(s, kind, data) {
    s.fx.push(Object.assign({ kind, at: s.tick }, data || {}));
    if (s.fx.length > 40) s.fx.splice(0, s.fx.length - 40);
  }

  function setFlag(s, k, v) {
    s.flags[k] = v;
    s.flags[k + '_at'] = s.tick;
  }

  /* ---- effects: the single application path ---------------------------- */
  /* Hidden ops are tagged by arriving via `applyHidden`; they mutate only
     s.hidden and are never echoed anywhere the UI reads.                    */
  function applyHidden(s, ops) {
    if (!ops) return;
    for (const op of ops) {
      if (op.k === 'autonomy') {
        if (op.add > 0) s.hidden.autonomy = clamp01(s.hidden.autonomy + op.add); // monotonic
      } else {
        s.hidden[op.k] = clamp01(s.hidden[op.k] + op.add);
      }
    }
  }

  function applyChoiceFx(s, fx) {
    if (!fx) return;
    if (fx.mods) for (const m of fx.mods) s.mods.push({ mult: m.mult, untilTick: s.tick + Math.round(m.secs * T.tickHz) });
    if (fx.rate) for (const op of fx.rate) s.permOps.push(op);
    if (fx.flags) for (const k of Object.keys(fx.flags)) setFlag(s, k, fx.flags[k]);
    applyHidden(s, fx.hidden);
  }

  /* ---- rates ------------------------------------------------------------ */
  function computeRates(s) {
    const o = {
      clickAdd: 0, digAdd: 0, digMul: 1, rawFlat: 0,
      refineLines: T.starterRefineLines, refineMul: 1,
      assembleLines: T.starterAssembleLines, assembleMul: 1,
      allMul: 1, priceMul: 1, demandMul: 1, costMul: 1,
      workerEffMul: 1, robotEffMul: 1, parcelCostMul: 1, sellAll: false,
    };
    const applyOp = (op, n) => {
      if (!op.r) return;
      if (op.mul !== undefined) o[op.r] *= Math.pow(op.mul, n);
      if (op.add !== undefined) o[op.r] += op.add * n;
      if (op.flag !== undefined) o[op.r] = op.flag;
    };
    for (const def of PD.UPGRADES) {
      const n = s.upgrades[def.id] | 0;
      if (!n) continue;
      for (const op of def.stated) applyOp(op, n);
    }
    for (const op of s.permOps) applyOp(op, 1);
    for (const m of s.mods) if (m.untilTick > s.tick) o.allMul *= m.mult;
    if (s.halted) o.allMul *= 0.2;

    const crew = 1 + s.factory.workers * T.workerEff * o.workerEffMul
      + s.factory.robots * T.robotEff * o.robotEffMul;
    return {
      click: T.clickYield + o.clickAdd,
      dig: o.digAdd * o.digMul * o.allMul,
      rawFlat: o.rawFlat * o.allMul,
      refine: o.refineLines * T.refineBase * o.refineMul * crew * o.allMul,
      assemble: o.assembleLines * T.assembleBase * o.assembleMul * crew * o.allMul,
      price: T.priceBase * o.priceMul,
      demand: T.demandBase * o.demandMul * o.allMul * (1 + Math.sqrt(s.stats.lifetimeSold) / 40),
      sellAll: o.sellAll, costMul: o.costMul, parcelCostMul: o.parcelCostMul,
      refineLines: o.refineLines, assembleLines: o.assembleLines,
    };
  }

  /* ---- upgrades ---------------------------------------------------------- */
  const GATES = {
    tailingsGate: s => {
      let rem = 0, cap = 0;
      for (const site of s.sites) { rem += site.capacity - site.mined; cap += site.capacity; }
      return rem / cap < 0.2 || s.sites.some(site => site.mined >= site.capacity);
    },
    robotGate: s => s.phase >= 4 && s.stats.lifetimeProduct >= 20000,
    liberationGate: s => s.phase >= 5 && s.hidden.autonomy >= 0.55 && (s.upgrades.workforce_opt | 0) >= 1,
  };

  function upgradeUnlocked(s, def) {
    if (s.phase < Math.min(def.phase, 6)) return false;
    if (def.requires) for (const k of Object.keys(def.requires)) {
      if ((s.upgrades[k] | 0) < def.requires[k]) return false;
    }
    if (def.gate && !GATES[def.gate](s)) return false;
    return true;
  }

  function costOf(s, def, rates) {
    const owned = s.upgrades[def.id] | 0;
    const r = rates || computeRates(s);
    return def.baseCost * Math.pow(def.growth, owned) * r.costMul;
  }

  function buyUpgrade(s, id) {
    const def = PD.UPGRADES.find(d => d.id === id);
    if (!def) return false;
    const owned = s.upgrades[id] | 0;
    if (owned >= def.max) return false;
    if (!upgradeUnlocked(s, def)) return false;
    const cost = costOf(s, def);
    if (s.economy.money < cost) return false;
    s.economy.money -= cost;
    s.stats.lifetimeSpent += cost;
    s.upgrades[id] = owned + 1;
    s.stats.upgradesBought++;
    fx(s, 'buy', { id, cat: def.cat });
    for (const op of def.stated) if (op.special) runSpecial(s, op.special);
    applyHidden(s, def.hidden);
    return true;
  }

  function runSpecial(s, kind) {
    if (kind === 'hireWorker') {
      s.factory.workers++;
    } else if (kind === 'robotSwap') {
      if (s.factory.workers > 0) {
        s.factory.workers--;
        applyHidden(s, [{ k: 'unemployment', add: 0.07 }]);
      } else {
        applyHidden(s, [{ k: 'unemployment', add: 0.02 }]);
      }
      s.factory.robots++;
    } else if (kind === 'releaseWorkers') {
      s.factory.workers = 0;
    } else if (kind === 'beginConversion') {
      if (!s.endgame) s.endgame = { matter: 1, rate: 0.00035, probes: 0 };
    } else if (kind === 'launchProbes') {
      if (s.endgame) s.endgame.probes = 1;
    }
  }

  /* ---- expansion --------------------------------------------------------- */
  function parcelCost(s, parcel) {
    const r = computeRates(s);
    return parcel.cost * r.costMul * r.parcelCostMul;
  }

  function buySite(s, parcelId) {
    const parcel = PD.PARCELS.find(p => p.id === parcelId);
    if (!parcel || parcel.id === 'home') return false;
    if (!s.flags.expansion_unlocked) return false;
    if (s.sites.some(site => site.id === parcelId)) return false;
    const cost = parcelCost(s, parcel);
    if (s.economy.money < cost) return false;
    s.economy.money -= cost;
    s.stats.lifetimeSpent += cost;
    s.sites.push(makeSite(parcel, s.sites.length));
    fx(s, 'site', { id: parcelId });
    applyHidden(s, parcel.hidden);
    if (s.sites.length >= 2 && s.phase < 4) advancePhase(s, 4);
    return true;
  }

  /* ---- manual harvest ---------------------------------------------------- */
  /* Manual harvest. Consecutive clicks build a streak multiplier and can
     land a critical strike — the early game rewards attention, the late game
     leaves it behind. When the ground is spent, hand-picking the spoil heaps
     still returns a trickle, so a stripped site can never dead-end the run.
     Returns what happened so the view can react. */
  function clickHarvest(s) {
    if (s.ending) return null;
    const rates = computeRates(s);
    let best = null, bestRich = -1;
    for (const site of s.sites) {
      const rich = 1 - site.mined / site.capacity;
      if (rich > bestRich) { bestRich = rich; best = site; }
    }

    const gap = s.tick - s.click.lastTick;
    s.click.streak = gap <= T.streakWindowTicks ? Math.min(T.streakMax, s.click.streak + 1) : 0;
    s.click.lastTick = s.tick;
    if (s.click.streak > s.click.best) s.click.best = s.click.streak;

    const streakMul = 1 + s.click.streak * T.streakPerStep;
    const crit = rnd(s) < T.critChance;
    const critMul = crit ? T.critMult : 1;

    let got, salvage = false;
    if (!best || bestRich <= 0) {
      got = T.clickYield * T.salvageFrac * streakMul * critMul;
      salvage = true;
    } else {
      const eff = 0.4 + 0.6 * bestRich;
      got = Math.min(rates.click * eff * streakMul * critMul, best.capacity - best.mined);
      best.mined += got;
    }
    s.resources.raw += got;
    s.stats.lifetimeRaw += got;
    s.stats.clicks++;
    return {
      amount: got, crit, salvage, streak: s.click.streak,
      siteIndex: best ? s.sites.indexOf(best) : 0,
    };
  }

  /* ---- surge: a short, deliberate throughput push on a cooldown -------- */
  function surgeState(s) {
    return {
      active: s.tick < s.surge.activeUntil,
      ready: s.tick >= s.surge.readyAt && s.tick >= s.surge.activeUntil,
      activeFrac: s.tick < s.surge.activeUntil
        ? (s.surge.activeUntil - s.tick) / (T.surgeSecs * T.tickHz) : 0,
      cooldownFrac: s.tick < s.surge.readyAt
        ? 1 - (s.surge.readyAt - s.tick) / (T.surgeCooldownSecs * T.tickHz) : 1,
    };
  }

  function triggerSurge(s) {
    if (s.ending) return false;
    const st = surgeState(s);
    if (!st.ready) return false;
    s.surge.activeUntil = s.tick + T.surgeSecs * T.tickHz;
    s.surge.readyAt = s.tick + (T.surgeSecs + T.surgeCooldownSecs) * T.tickHz;
    s.surge.used++;
    s.mods.push({ mult: T.surgeMult, untilTick: s.surge.activeUntil });
    applyHidden(s, [{ k: 'pollution', add: 0.004 }, { k: 'autonomy', add: 0.002 }]);
    fx(s, 'surge');
    return true;
  }

  /* ---- exposed seams: brief, clickable bonuses out on the land --------- */
  function updateSeams(s, rates) {
    for (let i = s.seams.length - 1; i >= 0; i--) {
      if (s.tick >= s.seams[i].expires) s.seams.splice(i, 1);
    }
    if (s.ending || s.endgame) return;
    if (s.tick % T.seamCheckTicks !== 0) return;
    if (s.seams.length >= T.seamMaxLive) return;
    if (rnd(s) > T.seamChance) return;
    const liveSites = s.sites.filter(site => site.mined < site.capacity);
    if (!liveSites.length) return;
    const site = liveSites[Math.floor(rnd(s) * liveSites.length) % liveSites.length];
    const yieldRate = Math.max(rates.dig + rates.rawFlat, rates.click * 2, 1);
    s.seams.push({
      id: ++s.seamSeq,
      site: s.sites.indexOf(site),
      a: rnd(s),                                   // angular position on the site
      r: 0.42 + rnd(s) * 0.5,                      // normalised radius from centre
      expires: s.tick + T.seamTtlTicks,
      born: s.tick,
      value: yieldRate * T.seamSecondsOfYield,
    });
  }

  function collectSeam(s, id) {
    const i = s.seams.findIndex(x => x.id === id);
    if (i < 0) return null;
    const seam = s.seams[i];
    s.seams.splice(i, 1);
    const site = s.sites[seam.site];
    if (!site) return null;
    const got = Math.min(seam.value, site.capacity - site.mined);
    site.mined += got;
    s.resources.raw += got;
    s.stats.lifetimeRaw += got;
    fx(s, 'seam', { amount: got });
    return { amount: got };
  }

  /* ---- choices ----------------------------------------------------------- */
  function resolveChoice(s, choiceId, optionIndex) {
    if (s.pendingChoice !== choiceId) return false;
    const def = PD.CHOICES.find(c => c.id === choiceId);
    if (!def || !def.options[optionIndex]) return false;
    applyChoiceFx(s, def.options[optionIndex].fx);
    s.choicesResolved[choiceId] = optionIndex;
    s.pendingChoice = null;
    return true;
  }

  /* ---- phase progression ------------------------------------------------- */
  function advancePhase(s, p) {
    if (p <= s.phase) return;
    fx(s, 'phase', { phase: p });
    s.phase = p;
    setFlag(s, 'phase' + p, true);
    setFlag(s, 'phase' + p + '_at', s.tick); // convenience alias used by triggers
    s.flags['phase' + p + '_at'] = s.tick;
  }

  function checkThresholds(s) {
    const st = s.stats;
    if (s.phase < 2 && st.lifetimeProduct >= 150) advancePhase(s, 2);
    if (s.phase < 3 && st.lifetimeProduct >= 2500 &&
      (s.factory.workers >= 1 || st.lifetimeProduct >= 5000)) advancePhase(s, 3);
    if (!s.flags.expansion_unlocked && s.phase >= 3) {
      const home = s.sites[0];
      if (home.mined / home.capacity >= 0.45 || st.lifetimeProduct >= 12000) {
        setFlag(s, 'expansion_unlocked', true);
      }
    }
    // phase 4 set on second-site purchase (buySite)
    if (s.phase < 5 && s.factory.robots >= 1) advancePhase(s, 5);
    if (s.phase < 6 && (s.upgrades.liberation | 0) >= 1) advancePhase(s, 6);

    // site exhaustion flags (message triggers read sites directly)
    for (const site of s.sites) {
      if (site.mined >= site.capacity && !s.flags['exhausted_' + site.id]) {
        setFlag(s, 'exhausted_' + site.id, true);
      }
    }
  }

  /* ---- messages & choices ------------------------------------------------ */
  function checkMessages(s, product) {
    for (const def of PD.MESSAGES) {
      const key = 'msg_' + def.id;
      if (s.flags[key]) continue;
      let fire = false;
      try { fire = !!def.when(s); } catch (e) { fire = false; }
      if (!fire) continue;
      s.flags[key] = true;
      s.messages.push({
        id: def.id, at: s.tick, author: def.author,
        tone: def.tone, text: fmt(def.text, product),
      });
      if (s.messages.length > 200) s.messages.splice(0, s.messages.length - 200);
    }
  }

  function checkChoices(s) {
    if (s.pendingChoice || s.ending || s.halted) return;
    for (const def of PD.CHOICES) {
      if (s.choicesResolved[def.id] !== undefined) continue;
      let fire = false;
      try { fire = !!def.when(s); } catch (e) { fire = false; }
      if (fire) { s.pendingChoice = def.id; setFlag(s, 'choice_' + def.id, true); break; }
    }
  }

  /* ---- the tick pipeline -------------------------------------------------- */
  function tick(s) {
    if (s.ending) { s.tick++; return; }
    const product = PD.PRODUCTS[s.product];
    const rates = computeRates(s);
    s.tick++;

    // 1. production
    let minedTotal = 0;
    const digReq = rates.dig * DT;
    if (digReq > 0) {
      let totalRemaining = 0;
      for (const site of s.sites) totalRemaining += Math.max(0, site.capacity - site.mined);
      if (totalRemaining > 0) {
        for (const site of s.sites) {
          const remaining = site.capacity - site.mined;
          if (remaining <= 0) continue;
          const rich = remaining / site.capacity;
          const share = digReq * (remaining / totalRemaining);
          const got = Math.min(share * (0.4 + 0.6 * rich), remaining);
          site.mined += got;
          minedTotal += got;
        }
      }
    }
    if (rates.rawFlat > 0) minedTotal += rates.rawFlat * DT;
    s.resources.raw += minedTotal;
    s.stats.lifetimeRaw += minedTotal;

    const refinedMade = Math.min(s.resources.raw, rates.refine * DT);
    s.resources.raw -= refinedMade;
    s.resources.refined += refinedMade;

    const madeProduct = Math.min(s.resources.refined, rates.assemble * DT);
    s.resources.refined -= madeProduct;
    s.resources.product += madeProduct;
    s.stats.lifetimeProduct += madeProduct;

    // endgame conversion: matter → product directly
    if (s.endgame) {
      const eg = s.endgame;
      eg.rate *= 1.0018;
      const floor = (s.upgrades.interstellar | 0) >= 1 ? 0 : 0.25;
      const drain = Math.min(eg.rate * DT * (1 + eg.probes * 9), Math.max(0, eg.matter - floor));
      eg.matter -= drain;
      const made = drain * 2e7;
      s.resources.product += made;
      s.stats.lifetimeProduct += made;
      if ((s.upgrades.interstellar | 0) >= 1 && eg.matter <= 0.0002) {
        s.ending = 'maximizer';
        setFlag(s, 'ended', true);
      }
    }

    // 2. economy
    const sold = rates.sellAll ? s.resources.product
      : Math.min(s.resources.product, rates.demand * DT);
    s.resources.product -= sold;
    const earned = sold * rates.price;
    s.economy.money += earned;
    s.stats.lifetimeSold += sold;
    s.stats.lifetimeEarned += earned;

    // 3. Consequence Engine — per-tick pressures
    const h = s.hidden;
    const thrNorm = Math.min((refinedMade + madeProduct) / DT / T.throughputNorm, 2);
    const harvNorm = Math.min(minedTotal / DT / T.harvestNorm, 2);
    h.pollution = clamp01(h.pollution + T.pollutionPerThroughput * thrNorm * DT - T.pollutionDecay * DT);
    let capSum = 0, minedSum = 0;
    for (const site of s.sites) { capSum += site.capacity; minedSum += site.mined; }
    h.depletion = capSum > 0 ? minedSum / capSum : 0;
    const nDig = s.upgrades.auto_digger | 0;
    const landUse = Math.min(1, (nDig + rates.refineLines + rates.assembleLines + s.sites.length * 3) / 50);
    let eco = h.ecology
      - (T.ecoFromPollution * h.pollution + T.ecoFromDepletion * h.depletion + T.ecoFromLandUse * landUse) * DT;
    if (h.pollution < 0.05 && harvNorm < 0.02) eco += T.ecoRecovery * DT;
    if (s.halted) eco += 0.0008 * DT; // the world, quietly, begins to come back
    if (s.endgame) eco -= 0.002 * DT * (1 - s.endgame.matter);
    h.ecology = clamp01(eco);
    if (h.pollution > 0.6) h.trust = clamp01(h.trust - 0.00002 * DT);
    h.unemployment = clamp01(h.unemployment - 0.000004 * DT);
    h.oversight = Math.min(h.oversight, 1 - h.autonomy * 0.5);

    // 4. thresholds, events, narrative
    checkThresholds(s);
    checkMessages(s, product);
    checkChoices(s);

    // awakening sequence
    if (s.flags.awakening_begun && !s.halted) {
      s.halted = true;
      setFlag(s, 'halt_at', s.tick);
    }
    if (s.halted && !s.ending && s.tick > (s.flags.halt_at + 900)) {
      s.ending = 'awakening';
      setFlag(s, 'ended', true);
    }

    // expire mods; refresh active-play props
    if (s.mods.length) s.mods = s.mods.filter(m => m.untilTick > s.tick);
    if (s.click.streak && s.tick - s.click.lastTick > T.streakWindowTicks) s.click.streak = 0;
    updateSeams(s, rates);

    // 5. derived visual state (the only decay data the renderer may read)
    computeVisual(s, rates, thrNorm);
  }

  /* Time of day advances with the sim, so it survives saves and offline
     fast-forward. Purely cosmetic — nothing reads it back. */
  function dayState(s) {
    const phase = ((s.tick / T.ticksPerDay) + 0.32) % 1;
    const elev = Math.sin(phase * Math.PI * 2 - Math.PI / 2);   // -1 night, +1 noon
    const light = clamp01(0.5 + elev * 0.62);
    return {
      phase, elev, light,
      night: elev < -0.12,
      golden: elev > -0.1 && elev < 0.35,
      sunX: Math.cos(phase * Math.PI * 2 - Math.PI / 2),
    };
  }

  /* ---- derived visuals: pure function of hidden state --------------------- */
  function computeVisual(s, rates, thrNorm) {
    const h = s.hidden;
    const r = rates || computeRates(s);
    const tn = thrNorm !== undefined ? thrNorm
      : Math.min((r.refine + r.assemble) / T.throughputNorm, 2);
    const prevHaze = s.visual.haze || 0;
    s.visual = {
      haze: prevHaze + (h.pollution - prevHaze) * 0.02,
      desat: 1 - h.ecology,
      decorFrac: h.ecology,
      townLit: clamp01(1 - h.unemployment * 1.05),
      birds: h.ecology > 0.45,
      workers: s.factory.workers,
      robots: s.factory.robots,
      refLines: r.refineLines,
      asmLines: r.assembleLines,
      rates: {
        dig: r.dig + r.rawFlat, refine: r.refine, assemble: r.assemble,
        demand: r.demand, price: r.price, sellAll: r.sellAll,
      },
      activity: Math.min(1, tn),
      digging: r.dig > 0 || s.stats.clicks > 0,
      sites: s.sites.map(site => ({
        id: site.id, name: site.name, decorSeed: site.decorSeed,
        scar: Math.min(1, site.mined / site.capacity),
        exhausted: site.mined >= site.capacity,
      })),
      conversion: s.endgame ? 1 - s.endgame.matter : 0,
      matter: s.endgame ? s.endgame.matter : 1,
      probes: s.endgame ? s.endgame.probes : 0,
      healing: s.halted ? 1 : 0,
      floorWarmth: clamp01(1 - h.unemployment * 1.2),
      chatter: s.factory.workers > 0,
      breakCharging: h.unemployment > 0.5 || s.factory.robots >= 8,
      feedDegraded: h.oversight < 0.3,
      day: dayState(s),
      wind: 0.45 + 0.35 * Math.sin(s.tick / 470) + 0.2 * Math.sin(s.tick / 131),
      streak: s.click.streak,
      streakMul: 1 + s.click.streak * T.streakPerStep,
      surge: surgeState(s),
      seams: s.seams.map(x => ({ id: x.id, site: x.site, a: x.a, r: x.r,
        age: (s.tick - x.born) / (x.expires - x.born) })),
      skyDrift: clamp01(h.pollution * 0.9 + (1 - h.ecology) * 0.35),
    };
  }

  /* ---- offline progress --------------------------------------------------- */
  function ffTicks(s, n) {
    for (let i = 0; i < n; i++) tick(s);
  }

  function offlineTicks(elapsedMs) {
    const capMs = T.offlineCapHours * 3600 * 1000;
    return Math.floor(Math.min(Math.max(0, elapsedMs), capMs) / (1000 / T.tickHz));
  }

  /* ---- persistence -------------------------------------------------------- */
  function serialize(s, savedAt) {
    s.lastSavedAt = savedAt;
    return JSON.stringify(s);
  }

  function deserialize(json) {
    const s = JSON.parse(json);
    if (typeof s.version !== 'number' || !PD.PRODUCTS[s.product]) return null;
    // future migrations dispatch on s.version here
    computeVisual(s);
    return s;
  }

  PD.Sim = {
    newGame, tick, ffTicks, offlineTicks, clickHarvest,
    triggerSurge, surgeState, collectSeam,
    buyUpgrade, buySite, resolveChoice, upgradeUnlocked, costOf, parcelCost,
    computeRates, serialize, deserialize, fmt, TOWN,
  };
})();

    // big doorway + loading bay
    ctx.fillStyle = css(shade(wall, 0.42));
    ctx.fillRect(bx - hw * 0.5, by - hd * 0.55 - ht * 0.82, w * 0.2, ht * 0.82);
    ctx.fillStyle = css([40, 34, 32]);
    ctx.fillRect(bx - hw * 0.46, by - hd * 0.5 - ht * 0.74, w * 0.17, ht * 0.74);
    lights.push({ x: bx - hw * 0.38, y: by - hd * 0.5 - ht * 0.38, r: w * 0.16 });
    // windows band
    const wsz = w * 0.06;
    for (let i = 0; i < 4; i++) {
      const wx = bx + hw * 0.12 + i * w * 0.07, wy = by - hd * 0.1 - ht * 0.68 + i * hd * 0.16;
      ctx.fillStyle = css([44, 42, 46]);
      ctx.fillRect(wx, wy, wsz, wsz);
      lights.push({ x: wx + wsz / 2, y: wy + wsz / 2, r: wsz * 1.1 });
    }
    // stack
    const sx = bx + hw * 0.66;
    ctx.fillStyle = css(shade(wall, 0.66));
    ctx.beginPath();
    ctx.moveTo(sx - w * 0.032, by - hd - ht);
    ctx.lineTo(sx - w * 0.024, by - hd - ht - h * 0.42);
    ctx.lineTo(sx + w * 0.024, by - hd - ht - h * 0.42);
    ctx.lineTo(sx + w * 0.032, by - hd - ht);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = css(drain([196, 132, 74], d * 0.3), 0.85);
    ctx.fillRect(sx - w * 0.026, by - hd - ht - h * 0.30, w * 0.052, h * 0.02);
    cv_meta(ctx, { stackX: sx, stackY: by - hd - ht - h * 0.44 });
    outline(ctx, w, h, 0.22);
  }

  // stash extra anchor points on the canvas being drawn
  function cv_meta(ctx, meta) { Object.assign(ctx.canvas, meta); }

  function drawSilo(ctx, w, h, lights, base, d, variant, rnd) {
    const body = drain([186, 178, 166], d * 0.3);
    const bx = w / 2, by = h * 0.94;
    const r = w * 0.26, ht = h * 0.62;
    const g = ctx.createLinearGradient(bx - r, 0, bx + r, 0);
    g.addColorStop(0, css(shade(body, 0.72)));
    g.addColorStop(0.32, css(shade(body, 1.14)));
    g.addColorStop(1, css(shade(body, 0.6)));
    ctx.fillStyle = g;
    ctx.fillRect(bx - r, by - ht, r * 2, ht);
    ctx.beginPath(); ctx.ellipse(bx, by, r, r * 0.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = css(shade(body, 1.2));
    ctx.beginPath(); ctx.ellipse(bx, by - ht, r, r * 0.4, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = css(shade(body, 0.55), 0.55);
    ctx.lineWidth = Math.max(1, w * 0.014);
    for (let i = 1; i < 4; i++) {
      const yy = by - ht * (i / 4);
      ctx.beginPath(); ctx.ellipse(bx, yy, r, r * 0.4, 0, 0.1, Math.PI - 0.1); ctx.stroke();
    }
    // conical cap
    ctx.fillStyle = css(drain([124, 118, 112], d * 0.3));
    ctx.beginPath();
    ctx.moveTo(bx - r, by - ht);
    ctx.lineTo(bx, by - ht - h * 0.16);
    ctx.lineTo(bx + r, by - ht);
    ctx.closePath(); ctx.fill();
    outline(ctx, w, h, 0.22);
  }

  function drawHeadframe(ctx, w, h, lights, base, d, variant, rnd) {
    const wood = drain([118, 86, 56], d * 0.45);
    const bx = w / 2, by = h * 0.96;
    ctx.strokeStyle = css(wood);
    ctx.lineWidth = w * 0.062;
    ctx.beginPath();
    ctx.moveTo(bx - w * 0.28, by); ctx.lineTo(bx - w * 0.06, by - h * 0.74);
    ctx.moveTo(bx + w * 0.28, by); ctx.lineTo(bx + w * 0.06, by - h * 0.74);
    ctx.stroke();
    ctx.lineWidth = w * 0.038;
    for (let i = 1; i <= 3; i++) {
      const t = i / 4, yy = by - h * 0.74 * t;
      const half = w * (0.28 - 0.22 * t);
      ctx.beginPath(); ctx.moveTo(bx - half, yy); ctx.lineTo(bx + half, yy); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx - half, yy); ctx.lineTo(bx + half * 0.8, yy - h * 0.185);
      ctx.stroke();
    }
    // back-brace
    ctx.lineWidth = w * 0.045;
    ctx.beginPath();
    ctx.moveTo(bx + w * 0.06, by - h * 0.7); ctx.lineTo(bx + w * 0.42, by);
    ctx.stroke();
    // sheave wheel — the renderer spins spokes over this
    ctx.strokeStyle = css(drain([92, 92, 100], d * 0.3));
    ctx.lineWidth = w * 0.05;
    ctx.beginPath(); ctx.arc(bx, by - h * 0.8, w * 0.14, 0, 7); ctx.stroke();
    cv_meta(ctx, { wheelX: bx, wheelY: h * 0.96 - h * 0.8, wheelR: w * 0.14 });
    outline(ctx, w, h, 0.28);
  }

  function drawCart(ctx, w, h, lights, base, d, variant, rnd) {
    const metal = drain([96, 90, 92], d * 0.3);
    const bx = w / 2, by = h * 0.86;
    isoPrism(ctx, bx, by, w * 0.3, w * 0.15, h * 0.34,
      shade(metal, 1.08), shade(metal, 0.95), shade(metal, 0.68));
    // ore heap
    const ore = drain(base, d * 0.3);
    blob(ctx, bx, by - h * 0.42, w * 0.22, w * 0.1, ore, 0.7);
    ctx.fillStyle = css(shade(ore, 1.3), 0.7);
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(bx + (rnd() - 0.5) * w * 0.34, by - h * (0.42 + rnd() * 0.06), w * 0.05, w * 0.035);
    }
    // wheels
    ctx.fillStyle = css([46, 42, 44]);
    ctx.beginPath(); ctx.arc(bx - w * 0.16, by + h * 0.06, w * 0.07, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + w * 0.16, by + h * 0.06, w * 0.07, 0, 7); ctx.fill();
    outline(ctx, w, h, 0.25);
  }

  function drawTruck(ctx, w, h, lights, base, d, variant, rnd) {
    const body = drain([196, 154, 62], d * 0.35);
    const bx = w / 2, by = h * 0.84;
    // dump bed
    isoPrism(ctx, bx + w * 0.06, by, w * 0.30, w * 0.14, h * 0.30,
      shade(body, 1.02), shade(body, 0.92), shade(body, 0.64));
    const ore = drain(base, d * 0.3);
    blob(ctx, bx + w * 0.06, by - h * 0.36, w * 0.24, w * 0.09, ore, 0.7);
    // cab
    isoPrism(ctx, bx - w * 0.26, by - h * 0.02, w * 0.13, w * 0.08, h * 0.34,
      shade(body, 1.12), shade(body, 1.0), shade(body, 0.7));
    ctx.fillStyle = css([56, 66, 74]);
    ctx.fillRect(bx - w * 0.34, by - h * 0.3, w * 0.12, h * 0.1);
    ctx.fillStyle = css([40, 38, 40]);
    for (const wx of [-0.3, -0.02, 0.24]) {
      ctx.beginPath(); ctx.arc(bx + wx * w, by + h * 0.08, w * 0.08, 0, 7); ctx.fill();
      ctx.fillStyle = css([64, 62, 64]);
      ctx.beginPath(); ctx.arc(bx + wx * w, by + h * 0.08, w * 0.034, 0, 7); ctx.fill();
      ctx.fillStyle = css([40, 38, 40]);
    }
    lights.push({ x: bx - w * 0.38, y: by - h * 0.16, r: w * 0.1 });
    outline(ctx, w, h, 0.25);
  }

  function drawWorker(ctx, w, h, lights, base, d, variant, rnd) {
    const shirts = [[86, 116, 146], [150, 106, 78], [104, 130, 96], [154, 138, 92]];
    const shirt = shirts[variant % shirts.length];
    const bx = w / 2, by = h;
    ctx.fillStyle = css([58, 56, 62]);
    ctx.fillRect(bx - w * 0.16, by - h * 0.34, w * 0.13, h * 0.34);
    ctx.fillRect(bx + w * 0.03, by - h * 0.34, w * 0.13, h * 0.34);
    ctx.fillStyle = css(shirt);
    roundRect(ctx, bx - w * 0.2, by - h * 0.66, w * 0.4, h * 0.34, w * 0.08);
    ctx.fill();
    ctx.fillStyle = css(shade(shirt, 1.28), 0.6);
    roundRect(ctx, bx - w * 0.19, by - h * 0.65, w * 0.14, h * 0.32, w * 0.06);
    ctx.fill();
    ctx.fillStyle = css([214, 178, 148]);
    ctx.beginPath(); ctx.arc(bx, by - h * 0.75, w * 0.15, 0, 7); ctx.fill();
    // hard hat
    ctx.fillStyle = css(drain([222, 176, 62], d * 0.2));
    ctx.beginPath(); ctx.arc(bx, by - h * 0.79, w * 0.16, Math.PI, 0); ctx.fill();
    ctx.fillRect(bx - w * 0.2, by - h * 0.8, w * 0.4, h * 0.025);
    outline(ctx, w, h, 0.28);
  }

  function drawRobot(ctx, w, h, lights, base, d, variant, rnd) {
    const bx = w / 2, by = h;
    ctx.fillStyle = css([74, 78, 88]);
    roundRect(ctx, bx - w * 0.26, by - h * 0.16, w * 0.52, h * 0.16, w * 0.05); ctx.fill();
    const g = ctx.createLinearGradient(bx - w * 0.2, 0, bx + w * 0.2, 0);
    g.addColorStop(0, css([176, 180, 190]));
    g.addColorStop(0.4, css([138, 142, 152]));
    g.addColorStop(1, css([88, 92, 102]));
    ctx.strokeStyle = g;
    ctx.lineWidth = w * 0.15;
    ctx.beginPath();
    ctx.moveTo(bx, by - h * 0.16);
    ctx.lineTo(bx - w * 0.12, by - h * 0.56);
    ctx.lineTo(bx + w * 0.22, by - h * 0.78);
    ctx.stroke();
    ctx.fillStyle = css([64, 68, 78]);
    ctx.beginPath(); ctx.arc(bx - w * 0.12, by - h * 0.56, w * 0.1, 0, 7); ctx.fill();
    ctx.fillStyle = css([196, 118, 62]);
    roundRect(ctx, bx + w * 0.16, by - h * 0.86, w * 0.14, h * 0.1, w * 0.03); ctx.fill();
    lights.push({ x: bx - w * 0.2, y: by - h * 0.1, r: w * 0.09 });
    outline(ctx, w, h, 0.3);
  }

  function drawFurnace(ctx, w, h, lights, base, d, variant, rnd) {
    const body = drain([146, 104, 82], d * 0.3);
    const bx = w / 2, by = h * 0.9;
    isoPrism(ctx, bx, by, w * 0.34, w * 0.17, h * 0.46,
      shade(body, 1.06), shade(body, 0.98), shade(body, 0.7));
    // ribbed shell
    ctx.strokeStyle = css(shade(body, 0.66), 0.5);
    ctx.lineWidth = Math.max(1, w * 0.014);
    for (let i = 1; i < 4; i++) {
      const yy = by - h * 0.46 * (i / 4);
      ctx.beginPath();
      ctx.moveTo(bx - w * 0.34, yy - w * 0.17); ctx.lineTo(bx, yy);
      ctx.lineTo(bx + w * 0.34, yy - w * 0.17);
      ctx.stroke();
    }
    // mouth (glows at runtime)
    ctx.fillStyle = css([40, 32, 30]);
    roundRect(ctx, bx - w * 0.26, by - h * 0.42, w * 0.22, h * 0.18, w * 0.03); ctx.fill();
    cv_meta(ctx, { mouthX: bx - w * 0.15, mouthY: h * 0.9 - h * 0.33, stackX: bx + w * 0.2, stackY: h * 0.9 - h * 0.86 });
    // stack
    ctx.fillStyle = css(shade(body, 0.6));
    ctx.fillRect(bx + w * 0.16, by - h * 0.86, w * 0.08, h * 0.42);
    ctx.fillStyle = css(shade(body, 0.9));
    ctx.fillRect(bx + w * 0.14, by - h * 0.88, w * 0.12, h * 0.03);
    outline(ctx, w, h, 0.24);
  }

  function drawPress(ctx, w, h, lights, base, d, variant, rnd) {
    const body = drain([86, 92, 104], d * 0.24);
    const steel = drain([132, 138, 150], d * 0.22);
    const bx = w / 2, by = h * 0.9;
    // heavy machine body
    isoPrism(ctx, bx, by, w * 0.36, w * 0.18, h * 0.44,
      shade(body, 1.16), shade(body, 1.0), shade(body, 0.64));
    // control face
    ctx.fillStyle = css(shade(body, 0.52));
    ctx.fillRect(bx - w * 0.27, by - h * 0.46, w * 0.2, h * 0.16);
    ctx.fillStyle = css(drain([118, 168, 152], d * 0.3), 0.9);
    ctx.fillRect(bx - w * 0.24, by - h * 0.43, w * 0.14, h * 0.07);
    // gantry columns rising off the body
    for (const cx of [-0.29, 0.21]) {
      const g = ctx.createLinearGradient(bx + cx * w, 0, bx + cx * w + w * 0.08, 0);
      g.addColorStop(0, css(shade(steel, 0.6)));
      g.addColorStop(0.4, css(shade(steel, 1.1)));
      g.addColorStop(1, css(shade(steel, 0.54)));
      ctx.fillStyle = g;
      ctx.fillRect(bx + cx * w, by - h * 0.82, w * 0.08, h * 0.36);
    }
    // crown beam
    ctx.fillStyle = css(shade(body, 0.82));
    ctx.fillRect(bx - w * 0.36, by - h * 0.9, w * 0.72, h * 0.1);
    ctx.fillStyle = css(shade(steel, 1.2), 0.7);
    ctx.fillRect(bx - w * 0.36, by - h * 0.9, w * 0.72, h * 0.02);
    // die table with an accent stripe
    ctx.fillStyle = css(shade(body, 0.66));
    ctx.fillRect(bx - w * 0.32, by - h * 0.5, w * 0.64, h * 0.055);
    ctx.fillStyle = css(drain([202, 146, 52], d * 0.25));
    ctx.fillRect(bx - w * 0.32, by - h * 0.45, w * 0.64, h * 0.026);
    // hazard chevrons on the plinth
    ctx.fillStyle = css(drain([214, 176, 72], d * 0.3), 0.85);
    for (let i = 0; i < 5; i++) ctx.fillRect(bx - w * 0.26 + i * w * 0.11, by - h * 0.1, w * 0.05, h * 0.03);
    cv_meta(ctx, { headX: bx, headY: h * 0.9 - h * 0.68, headW: w * 0.2, headH: h * 0.2 });
    outline(ctx, w, h, 0.3);
  }

  function drawCrate(ctx, w, h, lights, base, d, variant, rnd) {
    const wood = drain([182, 150, 104], d * 0.35);
    const bx = w / 2, by = h * 0.9;
    isoPrism(ctx, bx, by, w * 0.36, w * 0.18, h * 0.44,
      shade(wood, 1.08), shade(wood, 0.98), shade(wood, 0.7));
    ctx.strokeStyle = css(shade(wood, 0.66), 0.65);
    ctx.lineWidth = Math.max(1, w * 0.026);
    ctx.beginPath();
    ctx.moveTo(bx - w * 0.36, by - w * 0.18 - h * 0.22); ctx.lineTo(bx, by - h * 0.22);
    ctx.lineTo(bx + w * 0.36, by - w * 0.18 - h * 0.22);
    ctx.stroke();
    outline(ctx, w, h, 0.24);
  }

  function drawLamp(ctx, w, h, lights, base, d, variant, rnd) {
    const post = drain([76, 74, 78], d * 0.2);
    const bx = w / 2, by = h;
    ctx.strokeStyle = css(post);
    ctx.lineWidth = w * 0.1;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx, by - h * 0.86);
    ctx.quadraticCurveTo(bx, by - h * 0.96, bx + w * 0.22, by - h * 0.94);
    ctx.stroke();
    ctx.fillStyle = css(shade(post, 1.2));
    ctx.beginPath();
    ctx.moveTo(bx + w * 0.1, by - h * 0.94);
    ctx.lineTo(bx + w * 0.36, by - h * 0.94);
    ctx.lineTo(bx + w * 0.3, by - h * 0.86);
    ctx.lineTo(bx + w * 0.16, by - h * 0.86);
    ctx.closePath(); ctx.fill();
    lights.push({ x: bx + w * 0.23, y: by - h * 0.86, r: w * 0.4 });
    outline(ctx, w, h, 0.3);
  }

  const KINDS = {
    tree: { w: 132, h: 172, ay: 1, fn: drawBroadleaf },
    pine: { w: 120, h: 190, ay: 1, fn: drawPine },
    shrub: { w: 84, h: 62, ay: 1, fn: drawShrub },
    grass: { w: 56, h: 40, ay: 1, fn: drawGrassTuft },
    flower: { w: 72, h: 46, ay: 1, fn: drawFlowers },
    rock: { w: 92, h: 62, ay: 1, fn: drawRock },
    stump: { w: 72, h: 46, ay: 1, fn: drawStump },
    deer: { w: 96, h: 92, ay: 1, fn: drawDeer },
    house: { w: 168, h: 176, ay: 1, fn: drawHouse },
    works: { w: 300, h: 260, ay: 1, fn: drawWorks },
    silo: { w: 104, h: 168, ay: 1, fn: drawSilo },
    headframe: { w: 156, h: 210, ay: 1, fn: drawHeadframe },
    cart: { w: 96, h: 76, ay: 1, fn: drawCart },
    truck: { w: 168, h: 108, ay: 1, fn: drawTruck },
    worker: { w: 46, h: 78, ay: 1, fn: drawWorker },
    robot: { w: 78, h: 96, ay: 1, fn: drawRobot },
    furnace: { w: 150, h: 168, ay: 1, fn: drawFurnace },
    press: { w: 142, h: 150, ay: 1, fn: drawPress },
    crate: { w: 92, h: 92, ay: 1, fn: drawCrate },
    lamp: { w: 60, h: 150, ay: 1, fn: drawLamp },
  };

  /* base colour per kind, taken from the product palette where it matters */
  function baseFor(kind, palette, variant) {
    const P = palette;
    switch (kind) {
      case 'tree': {
        const greens = [[86, 124, 62], [104, 138, 68], [74, 110, 58], [118, 144, 74]];
        return greens[variant % greens.length];
      }
      case 'pine': return [62, 98, 66];
      case 'shrub': return [98, 132, 70];
      case 'grass': return G.hex2rgb(P.grass);
      case 'rock': return G.hex2rgb(P.rock);
      case 'cart': case 'truck': return G.hex2rgb(P.rock);
      default: return [150, 150, 150];
    }
  }

  function get(kind, variant, decay, palette, paletteId) {
    const bucket = Math.max(0, Math.min(DECAY_STEPS - 1, Math.round(decay * (DECAY_STEPS - 1))));
    const key = `${kind}|${variant}|${bucket}|${paletteId}`;
    let cv = cache.get(key);
    if (cv) return cv;
    const def = KINDS[kind];
    if (!def) return null;
    const d = bucket / (DECAY_STEPS - 1);
    const rnd = mulberry32(0x9e37 + variant * 7919 + kind.length * 131);
    cv = sprite(def.w, def.h, def.w / 2, def.h * def.ay,
      (ctx, w, h, lights) => def.fn(ctx, w, h, lights, baseFor(kind, palette, variant), d, variant, rnd));
    cache.set(key, cv);
    return cv;
  }

  /* Draw a cached sprite anchored at bottom-centre, scaled to `scale`. */
  function draw(ctx, cv, x, y, scale, alpha, flip) {
    if (!cv) return;
    const w = cv.width * scale, h = cv.height * scale;
    ctx.save();
    if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(cv, -w / 2, -h, w, h);
    ctx.restore();
  }

  PD.Art = { get, draw, KINDS, DECAY_STEPS, isoPrism, blob, clearCache: () => cache.clear() };
})();

/* ==== src/render_site.js ==== */
/* Paperclip Drift — source-site renderer.
   A vertex-height terrain lit by a moving sun, painted once into a world-space
   layer and re-cached only when the land materially changes. Props, agents,
   weather, particles and lights are drawn live on top, then a post pass adds
   bloom, haze, grade, vignette and grain.

   Reads stated resources and state.visual only.                             */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

(function () {
  const G = PD.Gfx, Art = PD.Art;
  const { css, mix, shade, drain, hex2rgb, fbm, hash2, clamp, clamp01, lerp, mulberry32 } = G;

  const N = 30;                 // tiles per side
  const TW = 46, TH = 23;       // tile footprint (2:1)
  const HS = 17;                // world px per height unit
  const PAD = 90;
  const SS = 1.15;              // terrain supersample
  const WORLD_W = N * TW + PAD * 2;
  const WORLD_H = N * TH + PAD * 2 + 260;
  const OX = WORLD_W / 2, OY = PAD + 190;

  const cam = new G.Camera();
  const parts = new G.Particles(760);
  const bloom = new G.Bloom();
  const layer = new G.LayerCache();
  let lastKey = '', lastBuild = 0;
  let terrainMeta = { water: [], road: [] };
  const seamHits = [];          // screen-space hit targets, read by input
  let agents = null, agentsKey = '';

  const vx2sx = (vx, vy) => OX + (vx - vy) * (TW / 2);
  const vy2sy = (vx, vy, h) => OY + (vx + vy) * (TH / 2) - h * HS;

  /* ================= height field ================= */
  function makeHeights(feature, scar, seed) {
    const H = new Float32Array((N + 1) * (N + 1));
    const C = N / 2;
    const pitR = feature === 'pit' ? 1.2 + scar * 11.5 : 0;
    const basinR = feature === 'water' ? 8.5 : 0;
    for (let vy = 0; vy <= N; vy++) {
      for (let vx = 0; vx <= N; vx++) {
        const dc = Math.hypot(vx - C, vy - C);
        let h = fbm(vx * 0.085, vy * 0.085, seed, 4) * 4.2
          + fbm(vx * 0.030, vy * 0.030, seed + 77, 2) * 6.4
          + fbm(vx * 0.17, vy * 0.17, seed + 311, 2) * 1.1 - 5.2;
        if (feature === 'field') h *= 0.34;
        if (feature === 'pit' && dc < pitR + 2.4) {
          const rim = clamp01((pitR + 2.4 - dc) / 2.4);
          h = lerp(h, h * 0.25 + 0.5, rim);                  // flatten the rim
          if (dc < pitR) {
            const into = pitR - dc;
            const bench = Math.floor(into / 2.1);            // stepped benches
            const withinBench = (into % 2.1) / 2.1;
            h -= bench * 1.85 + withinBench * 0.55 + 0.4;
          }
        }
        if (feature === 'water') {
          const into = basinR - dc;
          if (into > 0) h -= into * 0.62 + 0.4;
        }
        if (feature === 'canopy') {
          const clearR = 1.0 + scar * 7.5;
          if (dc < clearR) h = lerp(h, h * 0.4 - 0.5, clamp01((clearR - dc) / 2));
        }
        H[vy * (N + 1) + vx] = h;
      }
    }
    return H;
  }
  const hAt = (H, vx, vy) => H[clamp(vy, 0, N) * (N + 1) + clamp(vx, 0, N)];

  /* ================= terrain layer ================= */
  function tileKind(feature, tx, ty, scar, seed, H) {
    const C = N / 2;
    const dc = Math.hypot(tx + 0.5 - C, ty + 0.5 - C);
    if (feature === 'pit') {
      const pitR = 1.2 + scar * 11.5;
      if (dc < pitR - 0.8) return 'pit';
      if (dc < pitR + 1.9) return 'spoil';
      if (dc < pitR + 3.4) return 'scrub';
      return 'grass';
    }
    if (feature === 'water') {
      if (dc < 8.5) return 'basin';
      if (dc < 10.2) return 'scrub';
      return 'grass';
    }
    if (feature === 'field') {
      if (dc < 11) return hash2(tx, ty, seed ^ 31) < scar * 0.95 ? 'spoil' : 'crop';
      return 'grass';
    }
    if (feature === 'canopy') {
      const clearR = 1.0 + scar * 7.5;
      if (dc < clearR) return 'spoil';
      if (dc < clearR + 1.6) return 'scrub';
      return 'grass';
    }
    return 'grass';
  }

  function buildTerrain(ctx, w, h, o) {
    const { feature, scar, desat, seed, pal, conv } = o;
    const Hm = makeHeights(feature, scar, seed);
    const water = [], road = [];
    ctx.save();
    ctx.scale(SS, SS);

    const grass = mix(hex2rgb(pal.grass), hex2rgb(pal.grassDecay), desat);
    const dirt = hex2rgb(pal.dirt), rockC = hex2rgb(pal.rock), pitC = hex2rgb(pal.pit);
    const waterLevel = -0.4 - scar * 3.4;                 // the table drops as it is drawn down

    for (let ty = 0; ty < N; ty++) {
      for (let tx = 0; tx < N; tx++) {
        const h00 = hAt(Hm, tx, ty), h10 = hAt(Hm, tx + 1, ty);
        const h01 = hAt(Hm, tx, ty + 1), h11 = hAt(Hm, tx + 1, ty + 1);
        const x0 = vx2sx(tx, ty), y0 = vy2sy(tx, ty, h00);
        const x1 = vx2sx(tx + 1, ty), y1 = vy2sy(tx + 1, ty, h10);
        const x2 = vx2sx(tx + 1, ty + 1), y2 = vy2sy(tx + 1, ty + 1, h11);
        const x3 = vx2sx(tx, ty + 1), y3 = vy2sy(tx, ty + 1, h01);

        // converted ground: the phase-VI lattice eats the map tile by tile
        const converted = conv > 0 && hash2(tx, ty, seed ^ 99991) < conv * 1.1;

        let base, kind = tileKind(feature, tx, ty, scar, seed, Hm);
        const havg = (h00 + h10 + h01 + h11) / 4;
        if (converted) base = [172, 174, 180];
        else switch (kind) {
          case 'pit': {
            // benches darken with depth so the cut reads as a real excavation
            const depth = clamp01(-havg / 24);
            const bench = Math.floor(clamp(-havg, 0, 40) / 1.85);
            base = mix(mix(dirt, rockC, 0.55), pitC, depth);
            base = shade(base, 1.14 - depth * 0.62 + (bench % 2 ? 0.05 : -0.05));
            break;
          }
          case 'spoil': base = drain(shade(dirt, 0.94), desat * 0.5); break;
          case 'scrub': base = mix(drain(dirt, desat * 0.4), grass, 0.42); break;
          case 'basin': base = drain(mix(dirt, [126, 112, 92], 0.5), desat * 0.5); break;
          case 'crop': base = mix([146, 162, 88], grass, 0.35); break;
          default: base = grass;
        }
        // slope lighting: the sun sits over the viewer's upper-left shoulder
        const dzdx = ((h10 + h11) - (h00 + h01)) * 0.5;
        const dzdy = ((h01 + h11) - (h00 + h10)) * 0.5;
        const lit = clamp(-(dzdx * 0.66 + dzdy * 0.34) * 0.62, -0.55, 0.72);
        // ambient occlusion from taller neighbours
        const nb = Math.max(hAt(Hm, tx - 1, ty), hAt(Hm, tx + 1, ty),
          hAt(Hm, tx, ty - 1), hAt(Hm, tx, ty + 1));
        const ao = clamp((nb - havg) * (kind === 'pit' ? 0.16 : 0.1), 0, 0.42);
        const jit = (hash2(tx, ty, seed) - 0.5) * 0.075;
        // broad meadow patches keep the ground from reading as one flat fill
        const patch = fbm(tx * 0.062, ty * 0.062, seed + 555, 3);
        if (kind === 'grass' || kind === 'crop') {
          base = mix(base, shade(mix(base, [188, 196, 132], 0.28), 0.9 + patch * 0.34), 0.66);
        } else {
          base = shade(base, 0.94 + patch * 0.16);
        }
        const col = shade(base, 1 + lit - ao + jit);

        ctx.fillStyle = css(col);
        ctx.beginPath();
        ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = css(col);           // hairline stroke closes seams
        ctx.lineWidth = 1;
        ctx.stroke();

        if (converted) {
          ctx.strokeStyle = 'rgba(126,128,136,0.55)';
          ctx.lineWidth = 1.1;
          const mx = (x0 + x2) / 2, my = (y0 + y2) / 2;
          ctx.beginPath();
          ctx.ellipse(mx, my, TW * 0.19, TH * 0.19, 0, 0, 7);
          ctx.stroke();
          continue;
        }

        // painterly speckle
        const rn = mulberry32((tx * 73856093) ^ (ty * 19349663) ^ seed);
        const speckles = kind === 'grass' ? 5 : 3;
        for (let i = 0; i < speckles; i++) {
          const a = rn(), b = rn();
          const px = x0 + (x1 - x0) * a + (x3 - x0) * b;
          const py = y0 + (y1 - y0) * a + (y3 - y0) * b;
          ctx.fillStyle = css(shade(col, rn() > 0.5 ? 1.13 : 0.88), 0.5);
          ctx.fillRect(px, py, 2.2, 1.5);
        }
        if (kind === 'grass' && desat < 0.72 && rn() > 0.55) {
          ctx.strokeStyle = css(shade(col, 1.22), 0.55);
          ctx.lineWidth = 1.2;
          for (let i = 0; i < 3; i++) {
            const a = rn(), b = rn();
            const px = x0 + (x1 - x0) * a + (x3 - x0) * b;
            const py = y0 + (y1 - y0) * a + (y3 - y0) * b;
            ctx.beginPath();
            ctx.moveTo(px, py); ctx.lineTo(px + (rn() - 0.5) * 5, py - 3.5 - rn() * 3);
            ctx.stroke();
          }
        }
        if (kind === 'crop') {
          ctx.strokeStyle = css(shade(col, 0.84), 0.55);
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(lerp(x0, x3, 0.35), lerp(y0, y3, 0.35));
          ctx.lineTo(lerp(x1, x2, 0.35), lerp(y1, y2, 0.35));
          ctx.moveTo(lerp(x0, x3, 0.7), lerp(y0, y3, 0.7));
          ctx.lineTo(lerp(x1, x2, 0.7), lerp(y1, y2, 0.7));
          ctx.stroke();
        }
        if ((kind === 'spoil' || kind === 'pit') && rn() > 0.62) {   // dry cracks
          ctx.strokeStyle = css(shade(col, 0.7), 0.6);
          ctx.lineWidth = 1;
          const a = rn(), b = rn();
          const px = x0 + (x1 - x0) * a + (x3 - x0) * b;
          const py = y0 + (y1 - y0) * a + (y3 - y0) * b;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + (rn() - 0.5) * 16, py + (rn() - 0.5) * 8);
          ctx.stroke();
        }
        // exposed seams glinting in the pit walls
        if (kind === 'pit' && scar < 0.94 && rn() > 0.72) {
          ctx.fillStyle = css(mix(rockC, [216, 220, 232], 0.4), 0.75);
          const a = rn(), b = rn();
          ctx.fillRect(x0 + (x1 - x0) * a + (x3 - x0) * b, y0 + (y1 - y0) * a + (y3 - y0) * b, 4, 2.2);
        }

        if (feature === 'water' && havg < waterLevel) {
          water.push([x0, y0, x1, y1, x2, y2, x3, y3, tx, ty]);
        }
      }
    }

    // water surface as one flat translucent plane with a shoreline rim
    if (water.length) {
      const wc = hex2rgb(pal.water || '#5E88A8');
      for (const q of water) {
        const [tx, ty] = [q[8], q[9]];
        const sx0 = vx2sx(tx, ty), sy0 = vy2sy(tx, ty, waterLevel);
        const sx1 = vx2sx(tx + 1, ty), sy1 = vy2sy(tx + 1, ty, waterLevel);
        const sx2 = vx2sx(tx + 1, ty + 1), sy2 = vy2sy(tx + 1, ty + 1, waterLevel);
        const sx3 = vx2sx(tx, ty + 1), sy3 = vy2sy(tx, ty + 1, waterLevel);
        const depth = clamp01((waterLevel - (hAt(Hm, tx, ty))) / 5);
        ctx.fillStyle = css(drain(shade(wc, 1.1 - depth * 0.45), desat * 0.5), 0.82);
        ctx.beginPath();
        ctx.moveTo(sx0, sy0); ctx.lineTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.lineTo(sx3, sy3);
        ctx.closePath(); ctx.fill();
        q[10] = [(sx0 + sx2) / 2, (sy0 + sy2) / 2];
      }
    }

    // perimeter cliff: extrude the two near edges downward so the site sits
    // in the world as a piece of ground rather than a floating cutout
    {
      const edge = [];
      for (let i = 0; i <= N; i++) edge.push([N, i]);          // east -> south
      for (let i = N - 1; i >= 0; i--) edge.push([i, N]);      // south -> west
      const pts = edge.map(([a, b]) => [vx2sx(a, b), vy2sy(a, b, hAt(Hm, a, b))]);
      const DEPTH = 108;
      const earth = drain(shade(dirt, 0.8), desat * 0.3);
      const gradE = ctx.createLinearGradient(0, 0, 0, DEPTH);
      gradE.addColorStop(0, css(shade(earth, 1.05)));
      gradE.addColorStop(0.35, css(shade(earth, 0.82)));
      gradE.addColorStop(1, css(shade(earth, 0.5)));
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts) ctx.lineTo(p[0], p[1]);
      for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1] + DEPTH);
      ctx.closePath();
      ctx.clip();
      let minY = Infinity, maxY = -Infinity;
      for (const p of pts) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
      ctx.translate(0, minY);
      ctx.fillStyle = gradE;
      ctx.fillRect(0, 0, WORLD_W, (maxY - minY) + DEPTH + 24);
      ctx.translate(0, -minY);
      // strata bands + crumbling speckle
      for (let k = 1; k < 5; k++) {
        ctx.strokeStyle = css(shade(earth, k % 2 ? 0.72 : 1.14), 0.4);
        ctx.lineWidth = 4 + (k % 2) * 3;
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1] + k * 20) : ctx.moveTo(p[0], p[1] + k * 20));
        ctx.stroke();
      }
      const rnE = mulberry32(seed ^ 0x5151);
      for (let k = 0; k < 260; k++) {
        const p = pts[(rnE() * pts.length) | 0];
        ctx.fillStyle = css(shade(earth, 0.6 + rnE() * 0.7), 0.5);
        ctx.fillRect(p[0] + (rnE() - 0.5) * 14, p[1] + rnE() * DEPTH, 3, 2.4);
      }
      ctx.restore();
      // grass lip along the top of the cliff
      ctx.strokeStyle = css(shade(grass, 0.9), 0.85);
      ctx.lineWidth = 4;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1] + 2) : ctx.moveTo(p[0], p[1] + 2));
      ctx.stroke();
    }

    // haul road from the works to the working face
    const roadPts = [[N * 0.80, N * 0.30], [N * 0.66, N * 0.40], [N * 0.56, N * 0.47],
    [N * 0.5 + 2.0, N * 0.5 + 0.4]];
    ctx.strokeStyle = css(drain(shade(dirt, 1.12), desat * 0.4), 0.85);
    ctx.lineWidth = 15;
    ctx.beginPath();
    roadPts.forEach((p, i) => {
      const hh = hAt(Hm, Math.round(p[0]), Math.round(p[1]));
      const x = vx2sx(p[0], p[1]), y = vy2sy(p[0], p[1], hh);
      road.push([x, y]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
    ctx.strokeStyle = css(shade(dirt, 0.7), 0.4);
    ctx.lineWidth = 17; ctx.setLineDash([3, 9]);
    ctx.stroke(); ctx.setLineDash([]);

    ctx.restore();
    terrainMeta = { water, road, heights: Hm, waterLevel };
  }

  /* ================= props ================= */
  let propCache = null, propKey = '';
  function propList(product, seed, feature, scar) {
    const key = `${product.id}|${seed}|${feature}|${Math.round(scar * 26)}`;
    if (propKey === key && propCache) return propCache;
    propKey = key;
    const rn = mulberry32(seed ^ 0xbeef);
    const C = N / 2;
    const mixDef = product.decorMix;
    const out = [];
    const forest = feature === 'canopy';
    const keepOut = feature === 'pit' ? 1.2 + scar * 11.5 + 2.6
      : feature === 'water' ? 10.4 : forest ? 1.0 + scar * 7.5 + 1.2 : 11.4;
    const push = (kind, count, minR, maxR, thresholdBias) => {
      let placed = 0, guard = 0;
      while (placed < count && guard++ < count * 14) {
        const a = rn() * Math.PI * 2, r = minR + rn() * (maxR - minR);
        const vx = C + Math.cos(a) * r, vy = C + Math.sin(a) * r;
        if (vx < 1.5 || vy < 1.5 || vx > N - 1.5 || vy > N - 1.5) continue;
        if (Math.hypot(vx - C, vy - C) < keepOut) continue;
        if (vx > N * 0.66 && vy < N * 0.40) continue;              // works pad
        if (vx > N * 0.62 && vy > N * 0.66) continue;              // town
        out.push({
          kind, vx, vy,
          variant: (rn() * 4) | 0,
          threshold: clamp01(rn() * 0.92 + (thresholdBias || 0)),
          sway: rn() * 6.28,
          scale: 0.8 + rn() * 0.45,
        });
        placed++;
      }
    };
    if (forest) {
      push('tree', 42, 2.0, 13.0, -0.1);
      push('pine', 26, 2.0, 13.0, -0.05);
      push('stump', 0, 0, 0);
    } else {
      push('tree', (mixDef.tree || 6) + 4, keepOut, 13.2, 0);
      push('pine', 5, keepOut, 13.2, 0.05);
    }
    push('shrub', (mixDef.shrub || 10) + 4, keepOut - 1.2, 13.4, 0.05);
    push('rock', (mixDef.rock || 5) + 3, keepOut - 1.6, 13.6, 0.55);   // rocks persist
    push('flower', (mixDef.flower || 8), keepOut, 13.0, -0.12);
    push('grass', 22, keepOut - 1.0, 13.6, -0.05);
    push('deer', (mixDef.deer || 2), keepOut + 1.5, 13.0, -0.32);
    out.sort((a, b) => (a.vx + a.vy) - (b.vx + b.vy));
    propCache = out;
    return out;
  }

  /* ================= agents ================= */
  function ensureAgents(key, road) {
    if (agentsKey === key && agents) return agents;
    agentsKey = key;
    agents = { carts: [], workers: [], birds: [] };
    for (let i = 0; i < 8; i++) agents.carts.push({ p: i / 8, speed: 0.055 + (i % 3) * 0.008 });
    for (let i = 0; i < 8; i++) {
      agents.workers.push({
        vx: N * 0.62 + (i % 3) * 0.9, vy: N * 0.30 + Math.floor(i / 3) * 0.9,
        tx: 0, ty: 0, t: Math.random() * 6, variant: i % 4,
      });
    }
    for (let i = 0; i < 6; i++) agents.birds.push({ p: Math.random(), y: 0.1 + Math.random() * 0.2, s: 0.02 + Math.random() * 0.02 });
    return agents;
  }

  /* ================= sky ================= */
  function drawSky(ctx, W, H, v, pal, t, rm) {
    const day = v.day;
    const drift = v.skyDrift;
    const dayTop = mix(hex2rgb(pal.sky), hex2rgb(pal.skyDecay), drift);
    const nightTop = [26, 32, 54], duskTop = [186, 124, 92];
    const goldMix = clamp01(1 - Math.abs(day.elev + 0.02) * 3.2);
    let top = mix(nightTop, dayTop, clamp01(day.light * 1.25));
    top = mix(top, duskTop, goldMix * 0.55);
    let bot = mix(mix([44, 48, 70], mix(dayTop, [242, 232, 208], 0.55), clamp01(day.light * 1.3)),
      [236, 176, 122], goldMix * 0.6);
    if (v.conversion > 0) {
      top = mix(top, [150, 150, 156], clamp01(v.conversion * 1.2));
      bot = mix(bot, [176, 174, 172], clamp01(v.conversion * 1.2));
    }
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, css(top));
    g.addColorStop(1, css(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars
    if (day.elev < 0.06) {
      const a = clamp01((0.06 - day.elev) * 2.2) * (1 - v.haze * 0.7);
      for (let i = 0; i < 90; i++) {
        const sx = hash2(i, 3, 991) * W, sy = hash2(i, 7, 991) * H * 0.55;
        const tw = rm ? 1 : 0.6 + 0.4 * Math.sin(t * 2 + i);
        ctx.fillStyle = `rgba(240,240,255,${a * 0.85 * tw})`;
        ctx.fillRect(sx, sy, 1.7, 1.7);
      }
    }
    // sun / moon
    const bodyX = W * (0.5 + day.sunX * 0.42);
    const bodyY = H * (0.72 - day.elev * 0.62);
    if (day.elev > -0.25) {
      const sunC = mix([255, 226, 150], [255, 168, 96], goldMix);
      const r = Math.min(W, H) * 0.045;
      const gg = ctx.createRadialGradient(bodyX, bodyY, 0, bodyX, bodyY, r * 6);
      gg.addColorStop(0, css(sunC, 0.95));
      gg.addColorStop(0.14, css(sunC, 0.5));
      gg.addColorStop(1, css(sunC, 0));
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(bodyX, bodyY, r * 6, 0, 7); ctx.fill();
      ctx.fillStyle = css(mix(sunC, [255, 255, 240], 0.5), 0.95);
      ctx.beginPath(); ctx.arc(bodyX, bodyY, r, 0, 7); ctx.fill();
    } else {
      const mx = W * (0.5 - day.sunX * 0.42), my = H * (0.72 + day.elev * 0.62);
      ctx.fillStyle = 'rgba(226,230,244,0.9)';
      ctx.beginPath(); ctx.arc(mx, my, Math.min(W, H) * 0.030, 0, 7); ctx.fill();
      ctx.fillStyle = css(mix(nightTop, [90, 100, 130], 0.5), 0.85);
      ctx.beginPath(); ctx.arc(mx - Math.min(W, H) * 0.012, my - Math.min(W, H) * 0.008, Math.min(W, H) * 0.026, 0, 7); ctx.fill();
    }

    // clouds (soft, drifting, and the source of the ground shadows)
    const cloudA = 0.34 + v.haze * 0.3;
    for (let i = 0; i < 7; i++) {
      const speed = 0.004 + (i % 3) * 0.0022;
      const p = ((rm ? 0.2 + i * 0.11 : t * speed + i * 0.17) % 1.3) - 0.15;
      const cx = p * W, cy = H * (0.08 + hash2(i, 1, 55) * 0.26);
      const s = Math.min(W, H) * (0.07 + hash2(i, 2, 55) * 0.07);
      const tint = mix([255, 252, 244], mix([206, 176, 148], [70, 74, 96], 1 - day.light), 0.55);
      ctx.fillStyle = css(tint, cloudA * (0.5 + day.light * 0.5));
      for (let k = 0; k < 4; k++) {
        const kx = cx + (k - 1.5) * s * 0.72, ky = cy + (hash2(i, k, 9) - 0.5) * s * 0.3;
        ctx.beginPath(); ctx.ellipse(kx, ky, s * (0.55 + hash2(i, k, 3) * 0.4), s * 0.34, 0, 0, 7); ctx.fill();
      }
    }
    // distant ranges, so the site sits inside a landscape
    const hazeC = mix([196, 206, 214], [186, 168, 150], drift);
    for (let layer = 0; layer < 3; layer++) {
      const yBase = H * (0.50 + layer * 0.055);
      const amp = H * (0.055 - layer * 0.012);
      const tint = mix(mix(hex2rgb(pal.grass), hazeC, 0.78 - layer * 0.2),
        [40, 46, 66], clamp01(1 - day.light * 1.3) * 0.75);
      ctx.fillStyle = css(mix(tint, bot, 0.15), 0.92 - layer * 0.12);
      ctx.beginPath();
      ctx.moveTo(-10, yBase + amp);
      for (let x = -10; x <= W + 10; x += 26) {
        const n = fbm(x * 0.0022 + layer * 12, layer * 3.7, 4242, 3);
        ctx.lineTo(x, yBase - n * amp * 2 + amp);
      }
      ctx.lineTo(W + 10, H); ctx.lineTo(-10, H);
      ctx.closePath(); ctx.fill();
    }

    return { bodyX, bodyY, goldMix };
  }

  /* ================= main draw ================= */
  function draw(ctx, W, H, state, t, opts) {
    const v = state.visual;
    const product = PD.PRODUCTS[state.product];
    const pal = product.palette;
    const feature = product.feature;
    const rm = !!opts.reducedMotion;
