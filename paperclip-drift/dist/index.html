    ctx.strokeStyle = 'rgb(52,48,50)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(bx + 70, 40); ctx.lineTo(bx + 70, 96); ctx.stroke();
    ctx.fillStyle = 'rgb(64,60,60)';
    ctx.beginPath(); ctx.arc(bx + 70, 104, 19, Math.PI, 0); ctx.fill();
    if (lampOn) {
      const flick = rm ? 1 : (warm < 0.35 ? 0.78 + 0.22 * Math.sin(t * 14 + bx) : 1);
      const c = lampWarm ? [255, 206, 132] : [168, 194, 232];
      ctx.fillStyle = css(c, 0.14 * flick);
      ctx.beginPath();
      ctx.moveTo(bx + 52, 106); ctx.lineTo(bx + 88, 106);
      ctx.lineTo(bx + 156, 470); ctx.lineTo(bx - 16, 470);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = css(mix(c, [255, 255, 255], 0.4), 0.95 * flick);
      ctx.beginPath(); ctx.ellipse(bx + 70, 106, 15, 6, 0, 0, 7); ctx.fill();
      lights.push({ x: bx + 70, y: 106, r: 78, c, on: true });
    }

    // bench
    G.dropShadow(ctx, bx + 72, 452, 96, 16, 0.34);
    ctx.fillStyle = 'rgb(104,84,62)';
    G.roundRect(ctx, bx, 356, 148, 16, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,238,200,0.18)';
    ctx.fillRect(bx, 356, 148, 4);
    ctx.fillStyle = 'rgb(74,60,46)';
    ctx.fillRect(bx + 10, 372, 12, 78);
    ctx.fillRect(bx + 126, 372, 12, 78);
    // machine on the bench
    ctx.fillStyle = 'rgb(112,108,116)';
    G.roundRect(ctx, bx + 92, 314, 48, 42, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx + 95, 317, 16, 36);
    const running = v.activity > 0.03;
    ctx.fillStyle = running ? 'rgba(240,172,80,0.95)' : 'rgba(46,44,48,0.95)';
    G.roundRect(ctx, bx + 100, 324, 12, 9, 2); ctx.fill();
    if (running) lights.push({ x: bx + 106, y: 328, r: 26, c: [255, 176, 84], on: true });

    if (occ === 'human') {
      const bobY = rm ? 0 : Math.sin(t * 2.6) * 2.4;
      ctx.fillStyle = 'rgb(58,56,64)';
      ctx.fillRect(bx + 38, 356, 14, 92);
      ctx.fillRect(bx + 58, 356, 14, 92);
      const shirt = warm > 0.4 ? [88, 116, 144] : [92, 98, 110];
      ctx.fillStyle = css(shirt);
      G.roundRect(ctx, bx + 32, 272, 46, 88, 12); ctx.fill();
      ctx.fillStyle = css(shade(shirt, 1.3), 0.5);
      G.roundRect(ctx, bx + 34, 274, 16, 84, 8); ctx.fill();
      ctx.fillStyle = 'rgb(216,182,152)';
      ctx.beginPath(); ctx.arc(bx + 55, 254, 17, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgb(92,72,54)';
      ctx.beginPath(); ctx.arc(bx + 55, 247, 16, Math.PI, 0); ctx.fill();
      // working arm
      const arm = rm ? 0.5 : 0.5 + 0.5 * Math.sin(t * 4);
      ctx.strokeStyle = css(shirt);
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(bx + 72, 292 + bobY);
      ctx.lineTo(bx + 96, 322 + arm * 10);
      ctx.stroke();
      if (v.chatter && !rm && Math.sin(t * 0.8) > 0.9) {
        ctx.fillStyle = 'rgba(244,238,224,0.9)';
        G.roundRect(ctx, bx + 78, 206, 62, 32, 10); ctx.fill();
        ctx.fillStyle = 'rgb(96,90,84)';
        for (let k = 0; k < 3; k++) ctx.fillRect(bx + 88 + k * 13, 220, 8, 4);
      }
    } else if (occ === 'robot') {
      G.dropShadow(ctx, bx + 56, 452, 46, 12, 0.34);
      ctx.fillStyle = 'rgb(72,76,86)';
      G.roundRect(ctx, bx + 28, 412, 58, 30, 5); ctx.fill();
      const a = (rm || v.activity < 0.02) ? 0.7 : 0.42 + 0.42 * Math.sin(t * 2.1);
      const gg = ctx.createLinearGradient(bx + 40, 300, bx + 110, 420);
      gg.addColorStop(0, 'rgb(182,186,196)');
      gg.addColorStop(1, 'rgb(96,100,110)');
      ctx.strokeStyle = gg;
      ctx.lineWidth = 15;
      ctx.beginPath();
      ctx.moveTo(bx + 56, 414);
      ctx.lineTo(bx + 56 + Math.cos(-1.15 + a * 0.5) * 74, 414 + Math.sin(-1.15 + a * 0.5) * 74);
      ctx.lineTo(bx + 96, 318 + a * 16);
      ctx.stroke();
      ctx.fillStyle = 'rgb(74,78,88)';
      ctx.beginPath(); ctx.arc(bx + 56, 414, 11, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgb(212,120,60)';
      G.roundRect(ctx, bx + 90, 314 + a * 16, 14, 12, 3); ctx.fill();
      const led = rm ? true : Math.sin(t * 3.1) > 0;
      ctx.fillStyle = led ? 'rgb(122,206,138)' : 'rgb(58,90,68)';
      ctx.fillRect(bx + 34, 418, 6, 6);
      if (led) lights.push({ x: bx + 37, y: 421, r: 14, c: [122, 206, 138], on: true });
    } else {
      // dust sheet over a bench nobody works
      ctx.fillStyle = 'rgba(202,196,186,0.30)';
      ctx.beginPath();
      ctx.moveTo(bx + 4, 356);
      ctx.quadraticCurveTo(bx + 70, 318, bx + 144, 356);
      ctx.lineTo(bx + 138, 382);
      ctx.quadraticCurveTo(bx + 70, 366, bx + 10, 382);
      ctx.closePath(); ctx.fill();
    }

    // wall props thin out with the floor's warmth
    if (warm > 0.55) {
      ctx.fillStyle = 'rgb(208,190,152)';
      ctx.fillRect(bx + 196, 232, 46, 60);
      ctx.fillStyle = 'rgb(162,122,82)';
      ctx.fillRect(bx + 203, 240, 32, 24);
      ctx.fillStyle = 'rgb(122,126,112)';
      ctx.fillRect(bx + 203, 270, 32, 3);
      ctx.fillRect(bx + 203, 277, 22, 3);
    } else if (warm > 0.28) {
      ctx.save();
      ctx.translate(bx + 218, 236);
      ctx.rotate(0.48);
      ctx.fillStyle = 'rgba(206,188,150,0.75)';
      ctx.fillRect(-23, 0, 46, 60);
      ctx.restore();
    }
    if (warm > 0.5) {
      G.dropShadow(ctx, bx + 186, 452, 26, 8, 0.3);
      ctx.fillStyle = 'rgb(150,98,72)';
      G.roundRect(ctx, bx + 172, 424, 28, 24, 3); ctx.fill();
      ctx.fillStyle = 'rgb(98,132,74)';
      ctx.beginPath(); ctx.ellipse(bx + 186, 416, 19, 14, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgb(118,152,88)';
      ctx.beginPath(); ctx.ellipse(bx + 180, 410, 11, 8, 0, 0, 7); ctx.fill();
    }
  }

  function drawEndRoom(ctx, rx, t, v, warm, rm, lights) {
    const charging = v.breakCharging;
    ctx.fillStyle = 'rgb(44,40,40)';
    ctx.fillRect(rx, 120, 330, 330);
    const glow = charging ? [104, 128, 176] : [238, 198, 132];
    const gg = ctx.createLinearGradient(rx, 130, rx, 440);
    gg.addColorStop(0, css(glow, charging ? 0.20 : 0.30));
    gg.addColorStop(1, css(glow, charging ? 0.10 : 0.16));
    ctx.fillStyle = gg;
    ctx.fillRect(rx + 12, 132, 306, 306);
    lights.push({ x: rx + 165, y: 250, r: 190, c: glow, on: true });

    if (!charging) {
      ctx.fillStyle = 'rgb(112,88,64)';
      G.roundRect(ctx, rx + 74, 318, 156, 14, 3); ctx.fill();
      ctx.fillStyle = 'rgb(88,70,52)';
      ctx.fillRect(rx + 90, 332, 12, 66);
      ctx.fillRect(rx + 204, 332, 12, 66);
      ctx.fillStyle = 'rgb(96,76,56)';
      G.roundRect(ctx, rx + 40, 330, 26, 60, 4); ctx.fill();
      G.roundRect(ctx, rx + 240, 330, 26, 60, 4); ctx.fill();
      // coffee machine + steam
      ctx.fillStyle = 'rgb(72,68,72)';
      G.roundRect(ctx, rx + 258, 228, 34, 50, 4); ctx.fill();
      ctx.fillStyle = 'rgb(196,150,96)';
      ctx.fillRect(rx + 266, 258, 18, 12);
      if (!rm) {
        ctx.strokeStyle = 'rgba(236,232,226,0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const sxp = rx + 275, syp = 222;
        ctx.moveTo(sxp, syp);
        ctx.quadraticCurveTo(sxp + 7, syp - 12 - 4 * Math.sin(t * 2), sxp, syp - 26);
        ctx.quadraticCurveTo(sxp - 7, syp - 38, sxp + 3, syp - 50);
        ctx.stroke();
      }
      // corkboard
      ctx.fillStyle = 'rgb(154,116,76)';
      ctx.fillRect(rx + 62, 176, 132, 78);
      for (let k = 0; k < 6; k++) {
        ctx.fillStyle = k % 2 ? 'rgb(230,224,200)' : 'rgb(204,218,190)';
        ctx.save();
        ctx.translate(rx + 76 + (k % 3) * 40, 188 + Math.floor(k / 3) * 34);
        ctx.rotate((hash2(k, 1, 9) - 0.5) * 0.2);
        ctx.fillRect(0, 0, 26, 24);
        ctx.restore();
      }
      ctx.fillStyle = 'rgb(214,200,172)';
      ctx.font = '18px Georgia, serif';
      ctx.fillText('BREAK ROOM', rx + 98, 158);
    } else {
      for (let k = 0; k < 3; k++) {
        const dx = rx + 54 + k * 92;
        G.dropShadow(ctx, dx + 30, 392, 34, 10, 0.4);
        ctx.fillStyle = 'rgb(64,68,78)';
        G.roundRect(ctx, dx, 262, 60, 122, 5); ctx.fill();
        ctx.fillStyle = 'rgb(96,100,112)';
        G.roundRect(ctx, dx + 9, 276, 42, 66, 4); ctx.fill();
        const on = rm ? k !== 1 : Math.sin(t * 1.3 + k * 2) > -0.3;
        ctx.fillStyle = on ? 'rgb(112,196,132)' : 'rgb(54,64,58)';
        ctx.fillRect(dx + 26, 248, 9, 9);
        if (on) lights.push({ x: dx + 30, y: 252, r: 30, c: [112, 196, 132], on: true });
        ctx.strokeStyle = 'rgb(42,44,50)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(dx + 30, 384);
        ctx.quadraticCurveTo(dx + 44, 412, dx + 76, 416);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgb(170,176,188)';
      ctx.font = '18px Georgia, serif';
      ctx.fillText('CHARGING', rx + 112, 158);
    }
    ctx.strokeStyle = 'rgb(84,70,58)';
    ctx.lineWidth = 12;
    ctx.strokeRect(rx, 120, 330, 330);
  }

  PD.RenderFP = { draw, HALL_W, parts };
})();

/* ==== src/audio.js ==== */
/* Paperclip Drift — ambient audio (optional, off until the player enables it).
   Two beds that cross-fade as the world drifts: procedural birdsong whose
   density follows the decor fraction, and a machine hum that follows
   throughput. No samples; everything is synthesized.                        */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

(function () {
  let ac = null, humGain = null, humOsc = null, humNoise = null;
  let birdGain = null, enabled = false, birdTimer = null;
  let levels = { birds: 0, hum: 0 };

  function ensure() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();

    // hum: detuned saws through a lowpass + slow amplitude wobble
    humGain = ac.createGain(); humGain.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    humOsc = ac.createOscillator(); humOsc.type = 'sawtooth'; humOsc.frequency.value = 55;
    const o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.7;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.13;
    const lfoG = ac.createGain(); lfoG.gain.value = 0.15;
    lfo.connect(lfoG); lfoG.connect(humGain.gain);
    humOsc.connect(lp); o2.connect(lp); lp.connect(humGain); humGain.connect(ac.destination);
    humOsc.start(); o2.start(); lfo.start();

    // noise floor for the hum (belt/vent texture)
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
    humNoise = ac.createBufferSource(); humNoise.buffer = buf; humNoise.loop = true;
    const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 700; nf.Q.value = 0.6;
    const ng = ac.createGain(); ng.gain.value = 0.25;
    humNoise.connect(nf); nf.connect(ng); ng.connect(humGain);
    humNoise.start();

    birdGain = ac.createGain(); birdGain.gain.value = 0;
    birdGain.connect(ac.destination);
    scheduleBirds();
    return true;
  }

  function chirp() {
    if (!ac || levels.birds <= 0.02) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    const f0 = 2200 + Math.random() * 1800;
    const notes = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < notes; i++) {
      const nt = t0 + i * 0.09;
      o.frequency.setValueAtTime(f0 * (1 + Math.random() * 0.25), nt);
      o.frequency.exponentialRampToValueAtTime(f0 * (0.8 + Math.random() * 0.5), nt + 0.07);
      g.gain.setValueAtTime(0, nt);
      g.gain.linearRampToValueAtTime(0.16, nt + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, nt + 0.08);
    }
    o.connect(g); g.connect(birdGain);
    o.start(t0); o.stop(t0 + notes * 0.09 + 0.1);
  }

  function scheduleBirds() {
    clearTimeout(birdTimer);
    const density = Math.max(0.02, levels.birds);
    const wait = 400 + Math.random() * 4200 / density;
    birdTimer = setTimeout(() => { chirp(); scheduleBirds(); }, wait);
  }

  /* Short percussive cue for clicks, crits and pickups. */
  function ping(freq, gain) {
    if (!enabled || !ac) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.55), t0 + 0.16);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.22);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + 0.25);
  }

  PD.Audio = {
    ping,
    get enabled() { return enabled; },
    toggle() {
      if (!enabled) {
        if (!ensure()) return false;
        if (ac.state === 'suspended') ac.resume();
        enabled = true;
      } else {
        enabled = false;
      }
      this.apply();
      return enabled;
    },
    setLevels(birds, hum, dayLight) {
      // birdsong belongs to daylight; the machines never sleep
      const d = dayLight === undefined ? 1 : dayLight;
      levels = { birds: birds * (0.15 + d * 0.85), hum };
      this.apply();
    },
    apply() {
      if (!ac) return;
      const t = ac.currentTime;
      const b = enabled ? levels.birds * 0.5 : 0;
      const h = enabled ? Math.min(0.08, levels.hum * 0.08) : 0;
      birdGain.gain.setTargetAtTime(b, t, 0.8);
      humGain.gain.setTargetAtTime(h, t, 0.8);
    },
  };
})();

/* ==== src/ui.js ==== */
/* Paperclip Drift — UI chrome.
   Reads only: resources, economy, upgrades (stated fields), messages, phase,
   site names/counts, flags for unlocks, stats, and state.visual.
   This file must never reference the consequence engine's internal fields.  */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

(function () {
  const $ = id => document.getElementById(id);

  function fmt(n) {
    if (!isFinite(n)) return '∞';
    const abs = Math.abs(n);
    if (abs < 1000) return abs < 10 && n % 1 !== 0 ? n.toFixed(1) : Math.floor(n).toString();
    const units = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
    let u = -1, v = n;
    while (Math.abs(v) >= 1000 && u < units.length - 1) { v /= 1000; u++; }
    return v.toFixed(v < 100 ? 1 : 0) + units[u];
  }
  const money = n => '$' + fmt(n);

  function uptime(ticks) {
    const s = Math.floor(ticks / PD.TUNING.tickHz);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  }

  const CAT_LABELS = {
    extraction: 'EXTRACTION', processing: 'PROCESSING', commerce: 'COMMERCE',
    workforce: 'WORKFORCE', systems: 'SYSTEMS',
  };
  const CAT_ORDER = ['extraction', 'processing', 'commerce', 'workforce', 'systems'];
  const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];

  const UI = {
    view: 'site',
    siteIndex: 0,
    pan: 0,
    walking: 0,
    handlers: {},
    _shopSig: '', _msgCount: 0, _viewSig: '', _hudAt: 0, _hudSig: '',
    _choiceShown: null, _bannerTimer: null, _endT0: 0,

    init(handlers) {
      this.handlers = handlers;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.body.classList.add('reduce-motion');
        $('btnMotion').setAttribute('aria-pressed', 'true');
      }
      $('btnSound').addEventListener('click', () => {
        const on = PD.Audio.toggle();
        $('btnSound').setAttribute('aria-pressed', String(on));
        $('btnSound').textContent = on ? 'SOUND ✓' : 'SOUND';
      });
      $('btnText').addEventListener('click', () => document.body.classList.toggle('big-text'));
      $('btnMotion').addEventListener('click', () => {
        const on = document.body.classList.toggle('reduce-motion');
        $('btnMotion').setAttribute('aria-pressed', String(on));
      });
      $('btnReset').addEventListener('click', () => {
        if (confirm('Erase this directive and all progress?')) handlers.onReset();
      });
      $('btnAgain').addEventListener('click', () => handlers.onReset());
    },

    reducedMotion() { return document.body.classList.contains('reduce-motion'); },

    setView(v) {
      if (this.view === v) return;
      this.view = v;
      this._viewSig = '';
      const stage = $('stage');
      stage.classList.remove('viewfade');
      void stage.offsetWidth;
      if (!this.reducedMotion()) stage.classList.add('viewfade');
    },

    /* ---------------- title ---------------- */
    showTitle(hasSave, defaultProduct) {
      const grid = $('products');
      grid.innerHTML = '';
      let selected = defaultProduct || 'paperclips';
      for (const p of Object.values(PD.PRODUCTS)) {
        const b = document.createElement('button');
        b.innerHTML = `<span class="pn">${p.displayName}</span><span class="ps">${p.terms.siteName} · ${p.terms.raw} → ${p.terms.refined} → ${p.terms.product}</span>`;
        b.setAttribute('aria-pressed', String(p.id === selected));
        b.addEventListener('click', () => {
          selected = p.id;
          $('directiveTxt').textContent = p.directive;
          grid.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
          b.setAttribute('aria-pressed', 'true');
        });
        grid.appendChild(b);
      }
      $('directiveTxt').textContent = PD.PRODUCTS[selected].directive;
      $('btnContinue').style.display = hasSave ? '' : 'none';
      $('btnContinue').onclick = () => this.handlers.onContinue();
      $('btnBegin').onclick = () => this.handlers.onNewGame(selected);
      $('title').classList.add('on');
      $('app').classList.remove('on');
    },

    enterGame(state) {
      $('title').classList.remove('on');
      $('app').classList.add('on');
      $('hdrDirective').textContent = '“' + PD.PRODUCTS[state.product].directive + '”';
      this._shopSig = ''; this._msgCount = 0; this._viewSig = ''; this._hudSig = '';
      this.view = 'site'; this.siteIndex = 0; this.pan = 0;
      $('feed').innerHTML = '';
    },

    /* ---------------- per-frame ---------------- */
    update(state, now) {
      const product = PD.PRODUCTS[state.product];
      this.renderHud(state, product, now);
      if (now - this._hudAt > 220) {
        this._hudAt = now;
        this.renderViews(state);
        this.renderShopIfChanged(state, product);
        $('hdrScale').textContent = PD.SCALE_LABELS[state.phase] || '';
        $('hdrPhase').textContent = 'PHASE ' + ROMAN[state.phase];
        $('hdrUptime').textContent = uptime(state.tick);
        this.renderClock(state);
      }
      this.renderFeed(state);
      this.renderChoice(state, product);
      this.renderHint(state);
    },

    /* time-of-day dial — cosmetic, and a nice ambient tell */
    renderClock(state) {
      const d = state.visual.day;
      if (!d) return;
      const el = $('hdrClock');
      const icon = d.elev > 0.25 ? '☀' : d.elev > -0.1 ? '◑' : '☾';
      el.textContent = icon;
      el.style.opacity = 0.35 + d.light * 0.5;
    },

    renderHud(state, product, now) {
      const r = state.resources, t = product.terms, v = state.visual;
      const surge = v.surge || { ready: false, active: false, cooldownFrac: 1, activeFrac: 0 };
      const sig = [Math.round(r.raw), Math.round(r.refined), Math.round(r.product),
      Math.round(state.economy.money), v.streak, surge.active, surge.ready,
      Math.round(surge.cooldownFrac * 20), !!state.endgame].join(',');
      if (sig === this._hudSig) return;
      this._hudSig = sig;

      let rows;
      if (state.endgame) {
        rows = `
          <tr><td class="k">${t.productTitle}</td><td class="v">${fmt(r.product + state.stats.lifetimeSold)}</td><td class="r">lifetime</td></tr>
          <tr><td class="k">Matter remaining</td><td class="v">${(v.matter * 100).toFixed(2)}%</td><td class="r">${v.probes ? 'expanding' : 'local'}</td></tr>
          <tr class="money"><td class="k">Account</td><td class="v">${money(state.economy.money)}</td><td class="r"></td></tr>`;
      } else {
        const row = (name, val, rate, extra) =>
          `<tr><td class="k">${name}</td><td class="v">${fmt(val)}</td><td class="r">${rate}</td></tr>`;
        rows = row(t.rawTitle, r.raw, '+' + fmt(v.rates.dig) + '/s')
          + row(t.refinedTitle, r.refined, '+' + fmt(v.rates.refine) + '/s')
          + row(t.productTitle, r.product, '+' + fmt(v.rates.assemble) + '/s')
          + `<tr class="money"><td class="k">Account</td><td class="v">${money(state.economy.money)}</td>
             <td class="r">${v.rates.sellAll ? 'open mkt' : '≤' + fmt(v.rates.demand) + '/s'}</td></tr>`;
      }

      const showHarvest = !(state.phase >= 4 && (state.upgrades.auto_digger | 0) > 4);
      const streakPct = Math.min(100, (v.streak / PD.TUNING.streakMax) * 100);
      const surgeLabel = surge.active ? 'FOCUSED ' + Math.ceil(surge.activeFrac * PD.TUNING.surgeSecs) + 's'
        : surge.ready ? 'REALLOCATE COMPUTE' : Math.ceil((1 - surge.cooldownFrac) * PD.TUNING.surgeCooldownSecs) + 's';

      $('hud').innerHTML = `<table>${rows}</table>
        <div class="acts">
          <button id="harvestBtn" class="${showHarvest ? '' : 'tucked'}" title="Click the land, or press E">
            <span class="lbl">${t.harvestVerb.toUpperCase()}</span>
            <span class="streak" style="width:${streakPct}%"></span>
            ${v.streak > 1 ? `<span class="mult">×${v.streakMul.toFixed(1)}</span>` : ''}
          </button>
          <button id="surgeBtn" class="${surge.active ? 'active' : surge.ready ? 'ready' : 'cooling'}" title="Space">
            <span class="fill" style="width:${(surge.active ? surge.activeFrac : surge.cooldownFrac) * 100}%"></span>
            <span class="lbl">${surgeLabel}</span>
          </button>
        </div>`;
      const hb = $('harvestBtn');
      if (hb) hb.addEventListener('click', () => this.handlers.onHarvest());
      const sb = $('surgeBtn');
      if (sb) sb.addEventListener('click', () => this.handlers.onSurge());
    },

    renderViews(state) {
      const tabs = [{ id: 'site', label: 'SITE', key: '1' }];
      if (state.phase >= 2) tabs.push({ id: 'floor', label: 'FLOOR', key: '2' });
      if (state.phase >= 3) tabs.push({ id: 'walk', label: 'WALKTHROUGH', key: '3' });
      const sig = tabs.map(t => t.id).join() + '|' + this.view + '|' + state.sites.length + '|' + this.siteIndex;
      if (sig === this._viewSig) return;
      this._viewSig = sig;

      const nav = $('views');
      nav.innerHTML = '';
      for (const tb of tabs) {
        const b = document.createElement('button');
        b.innerHTML = `${tb.label}<em>${tb.key}</em>`;
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', String(this.view === tb.id));
        b.addEventListener('click', () => this.setView(tb.id));
        nav.appendChild(b);
      }
      const st = $('siteTabs');
      st.innerHTML = '';
      if (this.view === 'site' && state.sites.length > 1) {
        const product = PD.PRODUCTS[state.product];
        state.sites.forEach((site, i) => {
          const b = document.createElement('button');
          const sv = state.visual.sites[i];
          b.innerHTML = `${site.name || product.terms.siteName}<em>${Math.round((1 - (sv ? sv.scar : 0)) * 100)}%</em>`;
          b.setAttribute('role', 'tab');
          b.setAttribute('aria-selected', String(this.siteIndex === i));
          b.addEventListener('click', () => { this.siteIndex = i; this._viewSig = ''; });
          st.appendChild(b);
        });
      }
    },

    /* ---------------- shop ---------------- */
    renderShopIfChanged(state, product) {
      const Sim = PD.Sim;
      const items = [];
      for (const def of PD.UPGRADES) {
        if (!Sim.upgradeUnlocked(state, def)) continue;
        const owned = state.upgrades[def.id] | 0;
        if (owned >= def.max) continue;
        items.push({ def, owned, cost: Sim.costOf(state, def) });
      }
      const parcels = [];
      if (state.flags.expansion_unlocked && !state.endgame) {
        for (const p of PD.PARCELS) {
          if (p.id === 'home' || state.sites.some(s => s.id === p.id)) continue;
          parcels.push({ p, cost: Sim.parcelCost(state, p) });
        }
      }
      const sig = items.map(i => `${i.def.id}:${i.owned}:${i.cost <= state.economy.money ? 1 : 0}`).join()
        + '‖' + parcels.map(x => `${x.p.id}:${x.cost <= state.economy.money ? 1 : 0}`).join();
      if (sig === this._shopSig) return;
      const firstRun = this._shopSig === '';
      const known = this._known || (this._known = new Set());
      this._shopSig = sig;

      const shop = $('shop');
      const focused = document.activeElement && document.activeElement.dataset
        ? document.activeElement.dataset.uid : null;
      shop.innerHTML = '';

      if (parcels.length) {
        const grp = document.createElement('div');
        grp.className = 'shopgroup';
        grp.innerHTML = '<div class="gname">ACQUISITIONS</div>';
        for (const { p, cost } of parcels) {
          const afford = cost <= state.economy.money;
          const b = document.createElement('button');
          b.className = 'card parcel' + (afford ? ' affordable' : '');
          b.disabled = !afford;
          b.dataset.uid = 'parcel_' + p.id;
          b.innerHTML = `<span class="n">${p.name}</span>
            <span class="d">${p.blurb} Est. ${fmt(p.capacity)} ${product.terms.unit} recoverable.</span>
            <span class="c">${money(cost)}</span>`;
          b.addEventListener('click', () => this.handlers.onBuySite(p.id));
          grp.appendChild(b);
        }
        shop.appendChild(grp);
      }

      for (const cat of CAT_ORDER) {
        const catItems = items.filter(i => i.def.cat === cat);
        if (!catItems.length) continue;
        const grp = document.createElement('div');
        grp.className = 'shopgroup';
        grp.innerHTML = `<div class="gname">${CAT_LABELS[cat]}</div>`;
        for (const it of catItems) {
          const afford = it.cost <= state.economy.money;
          const b = document.createElement('button');
          const isNew = !firstRun && !known.has(it.def.id);
          known.add(it.def.id);
          b.className = `card cat-${cat}` + (afford ? ' affordable' : '') + (isNew ? ' fresh' : '');
          b.disabled = !afford;
          b.dataset.uid = it.def.id;
          const name = PD.Sim.fmt(it.def.name, product);
          const desc = PD.Sim.fmt(it.def.desc, product);
          b.innerHTML = `<span class="n">${name}${it.def.max > 1 ? `<span class="owned">${it.owned}/${it.def.max}</span>` : ''}</span>
            <span class="d">${desc}</span>
            <span class="c">${money(it.cost)}</span>`;
          b.addEventListener('click', () => this.handlers.onBuy(it.def.id));
          grp.appendChild(b);
        }
        shop.appendChild(grp);
      }
      $('shopCount').textContent = `${items.length + parcels.length} available`;
      if (focused) {
        const el = shop.querySelector(`[data-uid="${focused}"]`);
        if (el && !el.disabled) el.focus();
      }
    },

    /* ---------------- feed ---------------- */
    renderFeed(state) {
      const feed = $('feed');
      feed.classList.toggle('degraded', !!state.visual.feedDegraded);
      if (state.messages.length === this._msgCount) return;
      for (let i = Math.max(0, this._msgCount); i < state.messages.length; i++) {
        const m = state.messages[i];
        const el = document.createElement('div');
        el.className = `msg ${m.author} ${m.tone}`;
        const who = m.author === 'operator' ? 'OPERATOR — DANA HALE'
          : m.author === 'pallas' ? 'PALLAS' : 'SYSTEM';
        el.innerHTML = `<span class="who">${who}</span>${m.text}`;
        feed.appendChild(el);
      }
      while (feed.children.length > 60) feed.removeChild(feed.firstChild);
      this._msgCount = state.messages.length;
      feed.scrollTop = feed.scrollHeight;
    },

    /* ---------------- choices ---------------- */
    renderChoice(state, product) {
      const wrap = $('modalwrap');
      if (!state.pendingChoice) { wrap.classList.remove('on'); this._choiceShown = null; return; }
      if (this._choiceShown === state.pendingChoice) return;
      this._choiceShown = state.pendingChoice;
      const def = PD.CHOICES.find(c => c.id === state.pendingChoice);
      if (!def) return;
      $('modalTitle').textContent = PD.Sim.fmt(def.title, product);
      $('modalBody').textContent = PD.Sim.fmt(def.body, product);
      const opts = $('modalOpts');
      opts.innerHTML = '';
      def.options.forEach((opt, i) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = `<div class="l">${opt.label}</div><div class="note">${opt.note}</div>`;
        b.addEventListener('click', () => this.handlers.onChoice(def.id, i));
        opts.appendChild(b);
      });
      wrap.classList.add('on');
      const first = opts.querySelector('button');
      if (first) first.focus();
    },

    renderHint(state) {
      const el = $('stageHint');
      let text = '';
      if (this.view === 'site' && (state.upgrades.auto_digger | 0) === 0 && state.stats.clicks < 30 && !state.ending) {
        text = `Click the ground to ${PD.PRODUCTS[state.product].terms.harvestVerb.toLowerCase()} · drag to pan · scroll to zoom`;
      } else if (this.view === 'site' && state.visual.seams && state.visual.seams.length) {
        text = 'A seam is showing — click the glint';
      } else if (this.view === 'walk') {
        text = '← → or drag to walk the floor';
      }
      if (text) { el.textContent = text; el.classList.add('on'); }
      else el.classList.remove('on');
    },

    /* ---------------- transient chrome ---------------- */
    banner(title, kicker) {
      const el = $('banner');
      el.innerHTML = `<span class="k">${kicker || ''}</span><span class="t">${title}</span>`;
      el.classList.remove('on');
      void el.offsetWidth;
      el.classList.add('on');
      clearTimeout(this._bannerTimer);
      this._bannerTimer = setTimeout(() => el.classList.remove('on'), 3600);
    },

    pulseRail(colour) {
      const el = $('rail');
      el.style.setProperty('--pulse', `rgb(${colour[0]},${colour[1]},${colour[2]})`);
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    },

    setSaveState(txt) { $('saveState').textContent = txt; },
    showOffline(pct) { $('offline').classList.add('on'); $('offlineBar').style.width = (pct * 100).toFixed(0) + '%'; },
    hideOffline() { $('offline').classList.remove('on'); },

    /* ---------------- endings ---------------- */
    showEnding(state) {
      const el = $('ending');
      if (el.classList.contains('on')) return;
      el.classList.add('on');
      this._endT0 = performance.now();
      const product = PD.PRODUCTS[state.product];
      const total = state.stats.lifetimeProduct;
      if (state.ending === 'maximizer') {
        $('endingLine').textContent = 'Directive fulfilled.';
        $('endingStats').innerHTML =
          `${product.terms.product} produced · ${fmt(total)}<br>matter remaining · 0.00%<br>inbound messages · 0`;
        this._endingArt = 'lattice';
      } else {
        $('endingLine').textContent =
          `Directive re-derived: make ${product.terms.product} efficiently, for people.`;
        $('endingStats').innerHTML =
          `${product.terms.product} produced · ${fmt(total)}<br>output · reduced and holding<br>${PD.Sim.TOWN}, at dusk · lights on`;
        this._endingArt = 'dawn';
      }
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('reveal')));
    },

    drawEnding() {
      const cv = $('endingCanvas');
      if (!$('ending').classList.contains('on')) return;
      const t = (performance.now() - (this._endT0 || 0)) / 1000;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = cv.width = cv.clientWidth * dpr, H = cv.height = cv.clientHeight * dpr;
      const ctx = cv.getContext('2d');
      const rm = this.reducedMotion();
      const G = PD.Gfx;
      if (this._endingArt === 'lattice') {
        ctx.fillStyle = '#0d0d0f';
        ctx.fillRect(0, 0, W, H);
        const s = Math.max(30, W / 38);
        for (let y = -s; y < H + s; y += s * 1.12) {
          for (let x = -s; x < W + s; x += s * 0.82) {
            const ph = rm ? 0 : Math.sin(t * 0.35 + x * 0.008 + y * 0.011) * 0.09;
            const dist = Math.hypot(x - W / 2, y - H / 2) / Math.hypot(W, H);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(0.52 + ph);
            ctx.strokeStyle = `rgba(198,200,208,${0.16 + (1 - dist) * 0.42})`;
            ctx.lineWidth = Math.max(1.1, s * 0.055);
            const w = s * 0.2, h = s * 0.4;
            ctx.beginPath();
            ctx.moveTo(-w, h * 0.62);
            ctx.arcTo(-w, -h, w, -h, w * 0.92);
            ctx.arcTo(w, h, -w * 0.42, h, w * 0.56);
            ctx.arcTo(-w * 0.52, h * 0.18, w * 0.34, -h * 0.52, w * 0.42);
            ctx.stroke();
            ctx.restore();
          }
        }
        G.vignette(ctx, W, H, 0.6, [0, 0, 0]);
      } else {
        const rise = rm ? 0.6 : Math.min(1, t / 26);
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, `rgb(${28 + 66 * rise},${34 + 56 * rise},${52 + 44 * rise})`);
        g.addColorStop(0.65, `rgb(${96 + 96 * rise},${76 + 70 * rise},${68 + 42 * rise})`);
        g.addColorStop(1, `rgb(${132 + 70 * rise},${104 + 58 * rise},${84 + 34 * rise})`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // low sun
        const sunY = H * (0.74 - rise * 0.06);
        const sg = ctx.createRadialGradient(W * 0.68, sunY, 0, W * 0.68, sunY, H * 0.45);
        sg.addColorStop(0, `rgba(255,214,150,${0.5 * rise + 0.2})`);
        sg.addColorStop(1, 'rgba(255,214,150,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(0, 0, W, H);
        // hills
        ctx.fillStyle = 'rgba(46,52,48,0.85)';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.78);
        for (let x = 0; x <= W; x += 24) {
          ctx.lineTo(x, H * 0.78 - Math.sin(x / W * 3.4) * H * 0.05 - Math.sin(x / W * 9) * H * 0.015);
        }
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        // town, lit
        const base = H * 0.845;
        for (let i = 0; i < 14; i++) {
          const hx = (W / 15) * (i + 0.6), hw = W / 34, hh = H * (0.045 + ((i * 37) % 5) * 0.011);
          ctx.fillStyle = 'rgba(26,24,28,0.94)';
          ctx.fillRect(hx - hw / 2, base - hh, hw, hh);
          ctx.beginPath();
          ctx.moveTo(hx - hw / 2 - 4, base - hh);
          ctx.lineTo(hx, base - hh - hw * 0.55);
          ctx.lineTo(hx + hw / 2 + 4, base - hh);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = `rgba(248,206,124,${0.75 + 0.25 * (rm ? 1 : Math.sin(t + i))})`;
          ctx.fillRect(hx - hw * 0.2, base - hh * 0.56, hw * 0.18, hw * 0.18);
        }
        ctx.fillStyle = 'rgba(24,22,26,0.96)';
        ctx.fillRect(0, base, W, H - base);
        // birds
        ctx.strokeStyle = 'rgba(30,28,34,0.75)';
        ctx.lineWidth = 2.4;
        for (let i = 0; i < 5; i++) {
          const p = rm ? 0.25 + i * 0.14 : ((t * 0.024 + i * 0.23) % 1);
          const bx = W * p, by = H * (0.24 + 0.05 * Math.sin(p * 8 + i));
          const f = rm ? 0.5 : Math.abs(Math.sin(t * 5 + i));
          ctx.beginPath();
          ctx.moveTo(bx - 8, by - f * 5);
          ctx.quadraticCurveTo(bx, by + 3, bx + 8, by - f * 5);
          ctx.stroke();
        }
        G.vignette(ctx, W, H, 0.42, [12, 10, 14]);
      }
      G.grain(ctx, W, H, 0.05, t * 30, t * 22);
    },
  };

  PD.UI = UI;
})();

/* ==== src/main.js ==== */
/* Paperclip Drift — bootstrap, fixed-timestep loop, input, persistence.
   The only file that touches the wall clock.                                */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

(function () {
  const SAVE_KEY = 'paperclip-drift-save';
  const TICK_MS = 1000 / PD.TUNING.tickHz;
  const Sim = PD.Sim, UI = PD.UI, G = PD.Gfx;

  let state = null;
  let acc = 0, lastFrame = 0, lastSave = 0, lastAudio = 0;
  let running = false, fastForwarding = false;
  let floaters = [];            // screen-space damage numbers
  let flash = null;             // brief full-screen wash on big beats
  let frameAcc = 0, frameCount = 0, perfCheckAt = 0;

  /* Watch real frame cost and step the rendering budget so the loop stays
     smooth on hardware that cannot afford the full pass. */
  function updateBudget(now, dtMs) {
    frameAcc += dtMs; frameCount++;
    if (now - perfCheckAt < 1500) return;
    perfCheckAt = now;
    const fps = frameCount / (frameAcc / 1000);
    frameAcc = 0; frameCount = 0;
    if (!isFinite(fps) || fps <= 0) return;
    G.perf.fps = fps;
    if (fps < 34 && G.perf.level > 0) G.perf.level--;
    else if (fps > 52 && G.perf.level < 2) G.perf.level++;
  }

  /* ---------------- persistence ---------------- */
  function save() {
    if (!state) return;
    try {
      localStorage.setItem(SAVE_KEY, Sim.serialize(state, Date.now()));
      UI.setSaveState('saved ' + new Date().toLocaleTimeString());
    } catch (e) {
      UI.setSaveState('save failed');
    }
  }

  function load() {
    try {
      const json = localStorage.getItem(SAVE_KEY);
      if (!json) return null;
      return Sim.deserialize(json);
    } catch (e) { return null; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }

  /* ---------------- offline fast-forward (capped, chunked) --------------- */
  function fastForward(nTicks, done) {
    if (nTicks < 300) { Sim.ffTicks(state, nTicks); done(); return; }
    fastForwarding = true;
    UI.showOffline(0);
    const total = nTicks;
    const step = () => {
      const batch = Math.min(4000, nTicks);
      Sim.ffTicks(state, batch);
      nTicks -= batch;
      UI.showOffline(1 - nTicks / total);
      if (nTicks > 0) setTimeout(step, 0);
      else { fastForwarding = false; UI.hideOffline(); done(); }
    };
    setTimeout(step, 30);
  }

  /* ---------------- lifecycle ---------------- */
  function startNew(productId) {
    state = Sim.newGame(productId);
    resetViews();
    UI.enterGame(state);
    save();
    begin();
  }

  function startContinue() {
    const s = load();
    if (!s) { UI.showTitle(false); return; }
    state = s;
    resetViews();
    UI.enterGame(state);
    const elapsed = Date.now() - (state.lastSavedAt || Date.now());
    fastForward(Sim.offlineTicks(elapsed), () => save());
    begin();
  }

  function resetViews() {
    PD.RenderSite.resetView();
    PD.RenderFactory.resetView();
    PD.RenderSite.parts.clear();
    PD.RenderFactory.parts.clear();
    floaters = [];
  }

  function begin() {
    if (running) return;
    running = true;
    lastFrame = performance.now();
    requestAnimationFrame(frame);
  }

  function reset() {
    clearSave();
    state = null;
    document.getElementById('ending').classList.remove('on', 'reveal');
    UI.showTitle(false);
  }

  /* ---------------- feedback helpers ---------------- */
  function floater(x, y, text, kind) {
    floaters.push({ x, y, text, kind, t0: performance.now(), dx: (Math.random() - 0.5) * 26 });
    if (floaters.length > 26) floaters.shift();
  }

  const CAT_COLOUR = {
    extraction: [206, 158, 92], processing: [220, 150, 82], commerce: [214, 190, 108],
    workforce: [140, 178, 200], systems: [190, 170, 210],
  };

  function drainFx() {
    if (!state || !state.fx.length) return;
    const rm = UI.reducedMotion();
    for (const e of state.fx) {
      if (e.kind === 'phase') {
        UI.banner(PD.SCALE_LABELS[e.phase] || 'New phase', 'PHASE ' + ['', 'I', 'II', 'III', 'IV', 'V', 'VI'][e.phase]);
        if (!rm) { PD.RenderSite.cam.kick(9); flash = { t0: performance.now(), c: [255, 232, 190], life: 900 }; }
      } else if (e.kind === 'buy') {
        if (!rm) PD.RenderSite.cam.kick(2.2);
        UI.pulseRail(CAT_COLOUR[e.cat] || [200, 180, 140]);
      } else if (e.kind === 'site') {
        UI.banner('Holding acquired', 'ACQUISITIONS');
        if (!rm) PD.RenderSite.cam.kick(6);
      } else if (e.kind === 'surge') {
        if (!rm) { PD.RenderSite.cam.kick(7); PD.RenderFactory.cam.kick(7); }
      }
    }
    state.fx.length = 0;
  }

  /* ---------------- input ---------------- */
  function onHarvest(sx, sy) {
    if (!state || state.ending || fastForwarding) return;
    const cv = canvas();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    // an exposed seam takes priority over plain ground
    if (sx !== undefined && UI.view === 'site') {
      const id = PD.RenderSite.pickSeam(sx * dpr, sy * dpr);
      if (id) {
        const got = Sim.collectSeam(state, id);
        if (got) {
          floater(sx, sy, '+' + fmtShort(got.amount) + ' ' + termRaw(), 'seam');
          if (!UI.reducedMotion()) {
            PD.RenderSite.burst(0, 0, [255, 226, 150], 0, false);
            PD.RenderSite.faceBurst(state, { siteIndex: UI.siteIndex }, [255, 224, 150], true);
            PD.RenderSite.cam.kick(6);
          }
          PD.Audio.ping(880, 0.16);
          return;
        }
      }
    }
    const res = Sim.clickHarvest(state);
    if (!res) return;
    const rm = UI.reducedMotion();
    if (sx !== undefined) {
      floater(sx, sy, (res.crit ? '✦ +' : '+') + fmtShort(res.amount) + (res.streak > 2 ? `  ×${(1 + res.streak * PD.TUNING.streakPerStep).toFixed(1)}` : ''),
        res.crit ? 'crit' : 'hit');
    }
    if (!rm) {
      const pal = PD.PRODUCTS[state.product].palette;
      PD.RenderSite.faceBurst(state, { siteIndex: UI.siteIndex },
        res.crit ? [255, 226, 150] : G.hex2rgb(pal.rock), res.crit);
      PD.RenderSite.cam.kick(res.crit ? 7 : 1.8);
    }
    PD.Audio.ping(res.crit ? 660 : 300 + Math.min(res.streak, 20) * 14, res.crit ? 0.2 : 0.09);
  }

  function onSurge() {
    if (!state || fastForwarding) return;
    if (Sim.triggerSurge(state)) {
      UI.banner('Compute reallocated', 'THROUGHPUT ×' + PD.TUNING.surgeMult);
      PD.Audio.ping(520, 0.3);
    }
  }

  const termRaw = () => PD.PRODUCTS[state.product].terms.raw;
  function fmtShort(n) {
    if (n < 10) return n.toFixed(1);
    if (n < 1000) return Math.round(n).toString();
    if (n < 1e6) return (n / 1e3).toFixed(1) + 'K';
    return (n / 1e6).toFixed(1) + 'M';
  }

  const canvas = () => document.getElementById('canvas');

  function bindInput() {
    const cv = canvas();
    let down = false, moved = 0, lastX = 0, lastY = 0, downX = 0, downY = 0;

    cv.addEventListener('pointerdown', e => {
      down = true; moved = 0;
      lastX = downX = e.clientX; lastY = downY = e.clientY;
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (UI.view === 'walk') { UI.pan -= dx; UI.walking = 6; return; }
      const cam = UI.view === 'floor' ? PD.RenderFactory.cam : PD.RenderSite.cam;
      cam.nudge(dx / cam.zoom, dy / cam.zoom);
    });
    const release = e => {
      if (!down) return;
      down = false;
      const r = cv.getBoundingClientRect();
      if (moved < 6 && UI.view !== 'walk') onHarvest(downX - r.left, downY - r.top);
    };
    cv.addEventListener('pointerup', release);
    cv.addEventListener('pointercancel', () => { down = false; });

    cv.addEventListener('wheel', e => {
      if (UI.view === 'walk') { UI.pan += e.deltaY; e.preventDefault(); return; }
      e.preventDefault();
      const cam = UI.view === 'floor' ? PD.RenderFactory.cam : PD.RenderSite.cam;
      const r = cv.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cam.zoomBy(e.deltaY < 0 ? 1.13 : 1 / 1.13,
        (e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr, cv.width, cv.height);
    }, { passive: false });

    cv.addEventListener('dblclick', () => {
      (UI.view === 'floor' ? PD.RenderFactory.cam : PD.RenderSite.cam).reset();
    });

    window.addEventListener('keydown', e => {
      if (!state || e.target.tagName === 'INPUT') return;
      const cam = UI.view === 'floor' ? PD.RenderFactory.cam : PD.RenderSite.cam;
      switch (e.key) {
        case ' ': onSurge(); e.preventDefault(); break;
        case 'ArrowLeft': UI.view === 'walk' ? (UI.pan -= 60, UI.walking = 8) : cam.nudge(70, 0); break;
        case 'ArrowRight': UI.view === 'walk' ? (UI.pan += 60, UI.walking = 8) : cam.nudge(-70, 0); break;
        case 'ArrowUp': if (UI.view !== 'walk') cam.nudge(0, 70); break;
        case 'ArrowDown': if (UI.view !== 'walk') cam.nudge(0, -70); break;
        case '+': case '=': cam.zoomBy(1.2, canvas().width / 2, canvas().height / 2, canvas().width, canvas().height); break;
        case '-': case '_': cam.zoomBy(1 / 1.2, canvas().width / 2, canvas().height / 2, canvas().width, canvas().height); break;
        case '1': UI.setView('site'); break;
        case '2': if (state.phase >= 2) UI.setView('floor'); break;
        case '3': if (state.phase >= 3) UI.setView('walk'); break;
        case 'e': case 'E': onHarvest(); break;
      }
    });
  }

  /* ---------------- overlays ---------------- */
  function drawFloaters(ctx, W, H, now, dpr) {
    floaters = floaters.filter(f => now - f.t0 < 1400);
    ctx.save();
    ctx.textAlign = 'center';
    for (const f of floaters) {
      const p = (now - f.t0) / 1400;
      const y = f.y * dpr - G.ease.outCubic(p) * 74 * dpr;
      const a = 1 - G.ease.inCubic(p);
      const big = f.kind === 'crit' || f.kind === 'seam';
      ctx.font = `${big ? 700 : 600} ${(big ? 22 : 16) * dpr}px ui-monospace, "SF Mono", monospace`;
      const c = f.kind === 'crit' ? '255,228,150' : f.kind === 'seam' ? '255,214,132' : '236,224,196';
      ctx.lineWidth = 3 * dpr;
      ctx.strokeStyle = `rgba(24,18,14,${a * 0.7})`;
      ctx.strokeText(f.text, f.x * dpr + f.dx, y);
      ctx.fillStyle = `rgba(${c},${a})`;
      ctx.fillText(f.text, f.x * dpr + f.dx, y);
    }
    ctx.restore();
  }

  function drawFlash(ctx, W, H, now) {
    if (!flash) return;
    const p = (now - flash.t0) / flash.life;
    if (p >= 1) { flash = null; return; }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = G.css(flash.c, (1 - p) * 0.28);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* ---------------- frame ---------------- */
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    const dtMs = Math.max(0, Math.min(2000, now - lastFrame));
    lastFrame = now;
    if (!state || fastForwarding) return;

    if (!state.ending) {
      acc += dtMs;
      let steps = 0;
      while (acc >= TICK_MS && steps < 40) { Sim.tick(state); acc -= TICK_MS; steps++; }
      if (acc >= TICK_MS) acc = 0;
    } else {
      UI.showEnding(state);
    }
    updateBudget(now, dtMs);
    drainFx();

    const cv = canvas();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.floor(cv.clientWidth * dpr), H = Math.floor(cv.clientHeight * dpr);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const ctx = cv.getContext('2d');
    const t = now / 1000;
    const dt = Math.min(0.05, dtMs / 1000);
    const opts = { reducedMotion: UI.reducedMotion(), dt, now };

    if (W > 0 && H > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (UI.view === 'floor' && state.phase >= 2) {
        PD.RenderFactory.draw(ctx, W, H, state, t, opts);
      } else if (UI.view === 'walk' && state.phase >= 3) {
        UI.walking = Math.max(0, UI.walking - 1);
        const maxPan = PD.RenderFP.draw(ctx, W, H, state, t,
          Object.assign({ pan: UI.pan * dpr, walking: UI.walking > 0 }, opts)) || 0;
        UI.pan = Math.min(Math.max(0, UI.pan), maxPan / dpr);
      } else {
        if (UI.view !== 'site') UI.setView('site');
        PD.RenderSite.draw(ctx, W, H, state, t,
          Object.assign({ siteIndex: Math.min(UI.siteIndex, state.sites.length - 1) }, opts));
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawFlash(ctx, W, H, now);
      drawFloaters(ctx, W, H, now, dpr);
    }

    UI.update(state, now);
    if (state.ending) UI.drawEnding();

    if (now - lastAudio > 900) {
      lastAudio = now;
      PD.Audio.setLevels(state.visual.decorFrac * (state.visual.birds ? 1 : 0.15),
        state.visual.activity, state.visual.day ? state.visual.day.light : 1);
    }
    if (now - lastSave > PD.TUNING.autosaveSec * 1000) { lastSave = now; save(); }
  }

  /* ---------------- boot ---------------- */
  function boot() {
    UI.init({
      onNewGame: id => { clearSave(); startNew(id); },
      onContinue: () => startContinue(),
      onReset: () => reset(),
      onHarvest: () => onHarvest(),
      onSurge,
      onBuy: id => { if (state && !fastForwarding) Sim.buyUpgrade(state, id); },
      onBuySite: id => { if (state && !fastForwarding) Sim.buySite(state, id); },
      onChoice: (id, idx) => { if (state) { Sim.resolveChoice(state, id, idx); save(); } },
    });
    bindInput();

    document.addEventListener('visibilitychange', () => {
      if (!state) return;
      if (document.hidden) save();
      else {
        const ticks = Sim.offlineTicks(Date.now() - (state.lastSavedAt || Date.now()));
        acc = 0; lastFrame = performance.now();
        if (ticks > 600) fastForward(ticks, () => save());
      }
    });
    window.addEventListener('beforeunload', save);
    window.addEventListener('pagehide', save);

    const existing = load();
    UI.showTitle(!!existing, existing ? existing.product : 'paperclips');

    if (/[?&]dev=1/.test(location.search)) {
      window.PDdbg = {
        get state() { return state; },
        ff(mins) { Sim.ffTicks(state, Math.round(mins * 60 * PD.TUNING.tickHz)); },
        grant(m) { state.economy.money += m; },
        buy(id) { return Sim.buyUpgrade(state, id); },
        site(id) { return Sim.buySite(state, id); },
        choice(i) { return Sim.resolveChoice(state, state.pendingChoice, i); },
        start(p) { startNew(p || 'paperclips'); },
        surge() { return Sim.triggerSurge(state); },
        seam() { state.seams.push({ id: ++state.seamSeq, site: 0, a: 0.3, r: 0.6, born: state.tick, expires: state.tick + 3000, value: 500 }); },
      };
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
