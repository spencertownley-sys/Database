    const dt = Math.min(0.05, opts.dt || 0.016);
    const sIdx = clamp(opts.siteIndex | 0, 0, v.sites.length - 1);
    const sv = v.sites[sIdx];
    const seed = sv.decorSeed;
    const scar = sv.scar, desat = v.desat, conv = v.conversion;
    const day = v.day;

    cam.update(dt, rm);
    const sky = drawSky(ctx, W, H, v, pal, t, rm);

    /* --- terrain layer (world space, cached) --- */
    const key = [sIdx, Math.round(scar * 26), Math.round(desat * 12), Math.round(conv * 14),
      state.product, feature].join('|');
    const now = opts.now || 0;
    const tCv = layer.get(key === lastKey ? layer.key : key, (WORLD_W * SS) | 0, (WORLD_H * SS) | 0,
      (c, w, h) => buildTerrain(c, w, h, { feature, scar, desat, seed, pal, conv }));
    lastKey = key;

    /* --- world transform --- */
    const base = Math.min(W / (WORLD_W * 0.82), H / (WORLD_H * 0.78));
    const S = base * cam.zoom;
    const tx = W / 2 + cam.shakeX - (WORLD_W / 2 - cam.x) * S;
    const ty = H / 2 + cam.shakeY - (WORLD_H / 2 - cam.y) * S;
    const w2s = (x, y) => [tx + x * S, ty + y * S];
    const Hm = terrainMeta.heights;
    const tileScreen = (vx, vy) => {
      const hh = Hm ? hAt(Hm, Math.round(vx), Math.round(vy)) : 0;
      return w2s(vx2sx(vx, vy), vy2sy(vx, vy, hh));
    };

    ctx.save();
    ctx.setTransform(S, 0, 0, S, tx, ty);
    ctx.imageSmoothingQuality = 'low';
    ctx.drawImage(tCv, 0, 0, WORLD_W, WORLD_H);

    /* --- cloud shadows sliding over the land --- */
    if (!rm && day.light > 0.25 && G.perf.level >= 2) {
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const p = ((t * (0.012 + i * 0.004) + i * 0.29) % 1.5) - 0.25;
        const cx = p * WORLD_W, cy = WORLD_H * (0.2 + hash2(i, 5, 21) * 0.55);
        const r = WORLD_W * (0.11 + hash2(i, 6, 21) * 0.08);
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, `rgba(58,54,72,${0.17 * day.light})`);
        g.addColorStop(1, 'rgba(58,54,72,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.45, 0, 0, 7); ctx.fill();
      }
      ctx.restore();
    }

    /* --- water sparkle --- */
    if (feature === 'water' && terrainMeta.water.length && !rm && G.perf.level >= 1) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < terrainMeta.water.length; i += 3) {
        const q = terrainMeta.water[i];
        if (!q[10]) continue;
        const [mx, my] = q[10];
        const ph = Math.sin(t * 1.5 + i * 0.7);
        ctx.fillStyle = `rgba(220,238,255,${0.10 + 0.12 * (ph * 0.5 + 0.5)})`;
        ctx.fillRect(mx - TW * 0.2, my - 1 + ph * 1.6, TW * 0.4, 1.6);
      }
      ctx.restore();
    }

    /* --- collect drawables and depth sort --- */
    const draws = [];
    const lights = [];
    const props = propList(product, seed, feature, scar);
    const wind = v.wind;
    const decayBucket = desat;

    for (const p of props) {
      if (v.decorFrac <= p.threshold) {
        if (feature === 'canopy' && (p.kind === 'tree' || p.kind === 'pine')) {
          draws.push({ d: p.vx + p.vy, kind: 'stump', p });
        }
        continue;
      }
      draws.push({ d: p.vx + p.vy, kind: 'prop', p });
    }

    // works building, silos, headframe, town — placed on the grid
    draws.push({ d: N * 0.73 + N * 0.30, kind: 'works', vx: N * 0.74, vy: N * 0.30 });
    draws.push({ d: N * 0.86 + N * 0.24, kind: 'silo', vx: N * 0.87, vy: N * 0.25 });
    draws.push({ d: N * 0.90 + N * 0.34, kind: 'silo', vx: N * 0.91, vy: N * 0.35 });
    if (feature === 'pit') {
      const R = 1.2 + scar * 11.5;
      const a = -Math.PI * 0.78;
      draws.push({
        d: N / 2 + Math.cos(a) * (R + 1.4) + N / 2 + Math.sin(a) * (R + 1.4),
        kind: 'headframe', vx: N / 2 + Math.cos(a) * (R + 1.4), vy: N / 2 + Math.sin(a) * (R + 1.4),
      });
    }
    const houses = [[N * 0.70, N * 0.74], [N * 0.78, N * 0.80], [N * 0.66, N * 0.84],
    [N * 0.86, N * 0.72], [N * 0.74, N * 0.90], [N * 0.88, N * 0.86]];
    houses.forEach((hp, i) => draws.push({ d: hp[0] + hp[1], kind: 'house', vx: hp[0], vy: hp[1], i }));
    draws.push({ d: N * 0.72 + N * 0.66, kind: 'lamp', vx: N * 0.72, vy: N * 0.66 });
    draws.push({ d: N * 0.82 + N * 0.94, kind: 'lamp', vx: N * 0.82, vy: N * 0.94 });

    // agents
    const ag = ensureAgents(key.split('|')[0] + state.product, terrainMeta.road);
    const activity = v.activity;
    const cartCount = clamp(Math.round(1 + activity * 7), 1, 8);
    if (!rm) for (const c of ag.carts) {
      c.p = (c.p + c.speed * dt * (0.4 + activity)) % 1;
      if (!(c.p >= 0)) c.p = 0;
    }
    const road = terrainMeta.road || [];
    if (road.length > 1) {
      for (let i = 0; i < cartCount; i++) {
        const c = ag.carts[i];
        const seg = c.p * (road.length - 1);
        const si = clamp(Math.floor(seg) || 0, 0, road.length - 2);
        const f = seg - si;
        const x = lerp(road[si][0], road[si + 1][0], f);
        const y = lerp(road[si][1], road[si + 1][1], f);
        draws.push({ d: 999 - (WORLD_H - y) * 0.001, kind: 'cart', wx: x, wy: y, big: v.rates.dig > 60, dir: 1 });
      }
    }
    // workers milling around the works
    const wcount = clamp(v.workers, 0, 8);
    if (!rm) for (const wkr of ag.workers) {
      wkr.t += dt;
      if (wkr.t > 4) {
        wkr.t = 0;
        wkr.tx = N * 0.60 + Math.random() * 2.6;
        wkr.ty = N * 0.24 + Math.random() * 2.6;
      }
      wkr.vx += ((wkr.tx || wkr.vx) - wkr.vx) * dt * 0.55;
      wkr.vy += ((wkr.ty || wkr.vy) - wkr.vy) * dt * 0.55;
    }
    for (let i = 0; i < wcount; i++) {
      const wkr = ag.workers[i];
      draws.push({ d: wkr.vx + wkr.vy, kind: 'worker', vx: wkr.vx, vy: wkr.vy, variant: wkr.variant });
    }
    for (let i = 0; i < clamp(v.robots, 0, 6); i++) {
      draws.push({ d: N * 0.60 + i * 0.4 + N * 0.36, kind: 'robot', vx: N * 0.58 + i * 0.42, vy: N * 0.37 });
    }

    draws.sort((a, b) => a.d - b.d);

    /* --- draw the sorted world --- */
    const spriteScale = 0.34;
    const nightAmt = clamp01(1 - day.light * 1.5);
    for (const it of draws) {
      let sx, sy;
      if (it.wx !== undefined) { sx = it.wx; sy = it.wy; }
      else {
        const hh = Hm ? hAt(Hm, Math.round(it.vx !== undefined ? it.vx : it.p.vx), Math.round(it.vy !== undefined ? it.vy : it.p.vy)) : 0;
        const gx = it.vx !== undefined ? it.vx : it.p.vx;
        const gy = it.vy !== undefined ? it.vy : it.p.vy;
        sx = vx2sx(gx, gy); sy = vy2sy(gx, gy, hh);
      }
      const sway = rm ? 0 : Math.sin(t * 1.1 + (it.p ? it.p.sway : it.d)) * wind * 2.2;

      if (it.kind === 'prop' || it.kind === 'stump') {
        const p = it.p;
        const kind = it.kind === 'stump' ? 'stump' : p.kind;
        const cv = Art.get(kind, p.variant, decayBucket, pal, state.product);
        if (!cv) continue;
        const sc = spriteScale * p.scale * (kind === 'tree' || kind === 'pine' ? 1.12 : 1);
        G.dropShadow(ctx, sx + 2, sy + 1, cv.width * sc * 0.34, cv.height * sc * 0.10, 0.3 * day.light + 0.06);
        ctx.save();
        ctx.translate(sx, sy);
        if (kind === 'tree' || kind === 'pine' || kind === 'shrub' || kind === 'grass') {
          ctx.transform(1, 0, sway * 0.014, 1, 0, 0);      // lean with the wind
        }
        ctx.translate(-sx, -sy);
        Art.draw(ctx, cv, sx, sy, sc);
        ctx.restore();
      } else if (it.kind === 'works') {
        const cv = Art.get('works', 0, decayBucket, pal, state.product);
        G.dropShadow(ctx, sx + 6, sy, cv.width * spriteScale * 0.46, cv.height * spriteScale * 0.11, 0.34 * day.light + 0.06);
        Art.draw(ctx, cv, sx, sy, spriteScale * 1.15);
        for (const L of cv.lights) {
          lights.push({ x: sx + (L.x - cv.ax) * spriteScale * 1.15, y: sy + (L.y - cv.ay) * spriteScale * 1.15, r: L.r * spriteScale * 1.6, c: [255, 196, 110], on: activity > 0.02 || nightAmt > 0.3 });
        }
        // stack smoke
        if (!rm && activity > 0.03 && Math.random() < activity * 0.5 + 0.06) {
          const stx = sx + (cv.stackX - cv.ax) * spriteScale * 1.15;
          const sty = sy + (cv.stackY - cv.ay) * spriteScale * 1.15;
          parts.spawn({
            kind: 'smoke', x: stx, y: sty, vx: 4 + wind * 10, vy: -16 - Math.random() * 10,
            g: -2, life: 3.4 + Math.random(), size: 3.2,
            c: mix([176, 170, 162], [96, 88, 84], clamp01(v.haze + 0.15)), drag: 0.995,
          });
        }
      } else if (it.kind === 'silo') {
        const cv = Art.get('silo', 0, decayBucket, pal, state.product);
        G.dropShadow(ctx, sx + 3, sy, cv.width * spriteScale * 0.36, cv.height * spriteScale * 0.08, 0.3 * day.light + 0.05);
        Art.draw(ctx, cv, sx, sy, spriteScale);
      } else if (it.kind === 'headframe') {
        const cv = Art.get('headframe', 0, decayBucket, pal, state.product);
        G.dropShadow(ctx, sx + 3, sy, cv.width * spriteScale * 0.3, cv.height * spriteScale * 0.07, 0.3 * day.light + 0.05);
        Art.draw(ctx, cv, sx, sy, spriteScale);
        // spinning sheave
        if (v.digging && activity > 0.01) {
          const wx = sx + (cv.wheelX - cv.ax) * spriteScale;
          const wy = sy + (cv.wheelY - cv.ay) * spriteScale;
          const r = cv.wheelR * spriteScale;
          const a = rm ? 0.6 : t * (1.2 + activity * 3);
          ctx.strokeStyle = 'rgba(60,56,58,0.85)';
          ctx.lineWidth = 1.6;
          for (let k = 0; k < 3; k++) {
            const aa = a + k * Math.PI / 3;
            ctx.beginPath();
            ctx.moveTo(wx - Math.cos(aa) * r, wy - Math.sin(aa) * r);
            ctx.lineTo(wx + Math.cos(aa) * r, wy + Math.sin(aa) * r);
            ctx.stroke();
          }
        }
      } else if (it.kind === 'house') {
        const cv = Art.get('house', it.i % 3, decayBucket, pal, state.product);
        G.dropShadow(ctx, sx + 4, sy, cv.width * spriteScale * 0.4, cv.height * spriteScale * 0.09, 0.32 * day.light + 0.05);
        Art.draw(ctx, cv, sx, sy, spriteScale * 0.92);
        const litHouses = Math.round(v.townLit * houses.length);
        const on = it.i < litHouses;
        for (const L of cv.lights) {
          lights.push({
            x: sx + (L.x - cv.ax) * spriteScale * 0.92, y: sy + (L.y - cv.ay) * spriteScale * 0.92,
            r: L.r * spriteScale * 1.5, c: [255, 200, 118], on: on && nightAmt > 0.12,
          });
        }
      } else if (it.kind === 'lamp') {
        const cv = Art.get('lamp', 0, decayBucket, pal, state.product);
        Art.draw(ctx, cv, sx, sy, spriteScale * 0.9);
        for (const L of cv.lights) {
          lights.push({ x: sx + (L.x - cv.ax) * spriteScale * 0.9, y: sy + (L.y - cv.ay) * spriteScale * 0.9, r: L.r * spriteScale * 2.4, c: [255, 214, 150], on: nightAmt > 0.16 });
        }
      } else if (it.kind === 'cart') {
        const cv = Art.get(it.big ? 'truck' : 'cart', 0, decayBucket, pal, state.product);
        G.dropShadow(ctx, sx + 2, sy + 1, cv.width * spriteScale * 0.3, cv.height * spriteScale * 0.1, 0.3 * day.light + 0.05);
        Art.draw(ctx, cv, sx, sy - 2, spriteScale * (it.big ? 0.9 : 0.8));
        if (it.big) for (const L of cv.lights) {
          lights.push({ x: sx + (L.x - cv.ax) * spriteScale * 0.9, y: sy - 2 + (L.y - cv.ay) * spriteScale * 0.9, r: L.r * spriteScale * 2, c: [255, 232, 190], on: nightAmt > 0.2 });
        }
        if (!rm && Math.random() < 0.22 * (0.3 + activity)) {
          parts.spawn({
            kind: 'dust', x: sx - 6, y: sy + 1, vx: -6 - Math.random() * 8, vy: -3 - Math.random() * 5,
            g: 6, life: 1.1 + Math.random() * 0.5, size: 2.6,
            c: mix(hex2rgb(pal.dirt), [210, 200, 180], 0.5), drag: 0.97,
          });
        }
      } else if (it.kind === 'worker') {
        const cv = Art.get('worker', it.variant, decayBucket, pal, state.product);
        G.dropShadow(ctx, sx + 1, sy, cv.width * spriteScale * 0.34, cv.height * spriteScale * 0.08, 0.3 * day.light + 0.05);
        const bob = rm ? 0 : Math.abs(Math.sin(t * 4 + it.variant)) * 1.6;
        Art.draw(ctx, cv, sx, sy - bob, spriteScale * 0.86);
      } else if (it.kind === 'robot') {
        const cv = Art.get('robot', 0, decayBucket, pal, state.product);
        G.dropShadow(ctx, sx + 1, sy, cv.width * spriteScale * 0.32, cv.height * spriteScale * 0.08, 0.3 * day.light + 0.05);
        Art.draw(ctx, cv, sx, sy, spriteScale * 0.86);
        for (const L of cv.lights) {
          lights.push({ x: sx + (L.x - cv.ax) * spriteScale * 0.86, y: sy + (L.y - cv.ay) * spriteScale * 0.86, r: L.r * spriteScale * 2, c: [120, 220, 150], on: true });
        }
      }
    }

    /* --- working face: dust and sparks where extraction happens --- */
    if (!rm && v.digging && activity > 0.01) {
      const R = feature === 'pit' ? 1.2 + scar * 11.5 : 3;
      const a = t * 0.5;
      const fx0 = N / 2 + Math.cos(a) * R * 0.62, fy0 = N / 2 + Math.sin(a) * R * 0.62;
      const hh = Hm ? hAt(Hm, Math.round(fx0), Math.round(fy0)) : 0;
      const px = vx2sx(fx0, fy0), py = vy2sy(fx0, fy0, hh);
      if (Math.random() < 0.35 + activity * 0.4) {
        parts.spawn({
          kind: 'dust', x: px + (Math.random() - 0.5) * 20, y: py, vx: (Math.random() - 0.5) * 22,
          vy: -12 - Math.random() * 16, g: 26, life: 1.3 + Math.random() * 0.7, size: 3.4,
          c: mix(hex2rgb(pal.dirt), [226, 214, 190], 0.45), drag: 0.98,
        });
      }
    }

    /* --- exposed seams: the clickable glint --- */
    seamHits.length = 0;
    for (const seam of v.seams) {
      if (seam.site !== sIdx) continue;
      const R = feature === 'pit' ? (1.2 + scar * 11.5) * 0.85 : 9;
      const ang = seam.a * Math.PI * 2;
      const gvx = N / 2 + Math.cos(ang) * R * seam.r;
      const gvy = N / 2 + Math.sin(ang) * R * seam.r;
      const hh = Hm ? hAt(Hm, Math.round(gvx), Math.round(gvy)) : 0;
      const px = vx2sx(gvx, gvy), py = vy2sy(gvx, gvy, hh);
      const pulse = rm ? 1 : 0.72 + 0.28 * Math.sin(t * 5);
      const fade = seam.age > 0.82 ? clamp01((1 - seam.age) / 0.18) : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = 'rgba(255,226,150,0.30)';
      ctx.beginPath(); ctx.ellipse(px, py, 20 * pulse, 10 * pulse, 0, 0, 7); ctx.fill();
      ctx.fillStyle = css([255, 236, 186], 0.95);
      ctx.beginPath(); ctx.ellipse(px, py - 3, 6.5, 5, 0, 0, 7); ctx.fill();
      // little crystal glints
      ctx.strokeStyle = 'rgba(255,246,214,0.95)';
      ctx.lineWidth = 1.6;
      for (let k = 0; k < 4; k++) {
        const aa = t * 1.4 + k * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(px + Math.cos(aa) * 5, py - 3 + Math.sin(aa) * 3);
        ctx.lineTo(px + Math.cos(aa) * 13 * pulse, py - 3 + Math.sin(aa) * 8 * pulse);
        ctx.stroke();
      }
      ctx.restore();
      lights.push({ x: px, y: py - 3, r: 26, c: [255, 226, 150], on: true });
      const scr = w2s(px, py - 3);
      seamHits.push({ id: seam.id, x: scr[0], y: scr[1], r: Math.max(26, 30 * S) });
    }

    /* --- particles (world space) --- */
    if (!rm) {
      // drifting leaves while the land is still alive
      if (v.decorFrac > 0.35 && Math.random() < 0.06) {
        parts.spawn({
          kind: 'leaf', x: Math.random() * WORLD_W, y: WORLD_H * (0.2 + Math.random() * 0.5),
          vx: 10 + wind * 16, vy: 6 + Math.random() * 8, g: 2, life: 4 + Math.random() * 2,
          size: 4, spin: (Math.random() - 0.5) * 4,
          c: drain([132, 152, 78], desat), drag: 0.999,
        });
      }
      parts.update(dt);
    }
    parts.draw(ctx);

    /* --- birds --- */
    if (v.birds && !rm) {
      ctx.strokeStyle = css([48, 44, 52], 0.65 * (0.4 + day.light));
      ctx.lineWidth = 1.6;
      for (const b of ag.birds) {
        b.p = (b.p + b.s * dt) % 1.2;
        const bx = b.p * WORLD_W - WORLD_W * 0.1;
        const by = WORLD_H * b.y + Math.sin(b.p * 9) * 12;
        const f = Math.abs(Math.sin(t * 7 + b.p * 20));
        ctx.beginPath();
        ctx.moveTo(bx - 6, by - f * 4);
        ctx.quadraticCurveTo(bx, by + 2, bx + 6, by - f * 4);
        ctx.stroke();
      }
    }

    ctx.restore();

    /* --- emissive bloom pass --- */
    let anyLight = false;
    if (G.perf.level >= 2 || (G.perf.level >= 1 && nightAmt > 0.25)) {
      for (const L of lights) if (L.on) { anyLight = true; break; }
    }
    if (anyLight) {
      const bctx = bloom.begin(W, H);
      bctx.setTransform(S * 0.5, 0, 0, S * 0.5, tx * 0.5, ty * 0.5);
      for (const L of lights) {
        if (!L.on) continue;
        const g = bctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
        g.addColorStop(0, css(L.c, 0.95));
        g.addColorStop(0.35, css(L.c, 0.35));
        g.addColorStop(1, css(L.c, 0));
        bctx.fillStyle = g;
        bctx.beginPath(); bctx.arc(L.x, L.y, L.r, 0, 7); bctx.fill();
      }
      bctx.setTransform(1, 0, 0, 1, 0, 0);
      bloom.composite(ctx, W, H, 0.55 + nightAmt * 0.6);
    }

    /* --- atmosphere: haze, night grade, vignette, grain --- */
    if (v.haze > 0.012) {
      const a = Math.min(0.66, v.haze * 0.62);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, `rgba(206,168,120,${a})`);
      g.addColorStop(0.55, `rgba(202,166,124,${a * 0.6})`);
      g.addColorStop(1, `rgba(198,168,132,${a * 0.32})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    if (nightAmt > 0.02) {
      G.grade(ctx, W, H, [92, 108, 168], nightAmt * 0.42, [40, 60, 120], nightAmt * 0.3);
    } else if (sky.goldMix > 0.15) {
      G.grade(ctx, W, H, [255, 214, 170], sky.goldMix * 0.18, [255, 190, 120], sky.goldMix * 0.22);
    }
    if (conv > 0.5) {
      ctx.fillStyle = `rgba(186,186,192,${(conv - 0.5) * 0.42})`;
      ctx.fillRect(0, 0, W, H);
    }
    G.vignette(ctx, W, H, 0.28 + nightAmt * 0.22, [10, 8, 14]);
    if (G.perf.level >= 2) G.grain(ctx, W, H, 0.06, t * 40, t * 27);
  }

  /* ================= input helpers ================= */
  function pickSeam(sx, sy) {
    for (const s of seamHits) {
      if (Math.hypot(sx - s.x, sy - s.y) <= s.r) return s.id;
    }
    return null;
  }

  function burst(x, y, colour, count, big) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = (big ? 70 : 40) * (0.4 + Math.random());
      parts.spawn({
        kind: i % 3 === 0 ? 'chip' : 'dust', x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6 - 30,
        g: 90, life: 0.7 + Math.random() * 0.6, size: big ? 4.4 : 3,
        c: colour, spin: (Math.random() - 0.5) * 8, drag: 0.96,
      });
    }
    parts.spawn({ kind: 'ring', x, y, life: 0.5, size: big ? 16 : 10, c: colour, add: true });
  }

  /* World-space burst at the current working face, used for click feedback. */
  function faceBurst(state, opts, colour, big) {
    const v = state.visual;
    const product = PD.PRODUCTS[state.product];
    const sIdx = clamp(opts.siteIndex | 0, 0, v.sites.length - 1);
    const scar = v.sites[sIdx].scar;
    const R = product.feature === 'pit' ? 1.2 + scar * 11.5 : 3;
    const a = Math.random() * Math.PI * 2;
    const gx = N / 2 + Math.cos(a) * R * 0.55, gy = N / 2 + Math.sin(a) * R * 0.55;
    const hh = terrainMeta.heights ? hAt(terrainMeta.heights, Math.round(gx), Math.round(gy)) : 0;
    burst(vx2sx(gx, gy), vy2sy(gx, gy, hh), colour, big ? 22 : 11, big);
  }

  PD.RenderSite = {
    draw, cam, parts, pickSeam, burst, faceBurst,
    get meta() { return terrainMeta; },
    get agents() { return agents; },
    resetView() { cam.reset(); },
    WORLD_W, WORLD_H, N,
  };
})();

/* ==== src/render_factory.js ==== */
/* Paperclip Drift — factory floor.
   The management view: stations you own, material actually moving between
   them, and the bottleneck visible as a starved machine or a growing pile.
   Reads stated resources and state.visual only.                            */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

(function () {
  const G = PD.Gfx, Art = PD.Art;
  const { css, mix, shade, drain, hex2rgb, hash2, clamp, clamp01, lerp, mulberry32 } = G;

  const FN = 12, FM = 8;
  const TW = 62, TH = 31;
  const PAD = 90;
  const SS = 1.3;
  const WORLD_W = FN * TW + PAD * 2 + 120;
  const WORLD_H = FM * TH + PAD * 2 + 260;
  const OX = WORLD_W / 2, OY = PAD + 170;

  const cam = new G.Camera();
  const parts = new G.Particles(520);
  const bloom = new G.Bloom();
  const layer = new G.LayerCache();
  let belt = [];                 // animated items on the line

  const sx_ = (x, y) => OX + (x - y) * (TW / 2);
  const sy_ = (x, y) => OY + (x + y) * (TH / 2);

  const REF_ROW = 1.5, ASM_ROW = 5.6, BELT_ROW = 3.55;

  function buildFloor(ctx, w, h, o) {
    const { warm, desat, pal } = o;
    ctx.save();
    ctx.scale(SS, SS);
    const slab = mix([132, 124, 116], [104, 106, 114], 1 - warm);

    for (let ty = 0; ty < FM; ty++) {
      for (let tx = 0; tx < FN; tx++) {
        const x0 = sx_(tx, ty), y0 = sy_(tx, ty);
        const x1 = sx_(tx + 1, ty), y1 = sy_(tx + 1, ty);
        const x2 = sx_(tx + 1, ty + 1), y2 = sy_(tx + 1, ty + 1);
        const x3 = sx_(tx, ty + 1), y3 = sy_(tx, ty + 1);
        const jit = (hash2(tx, ty, 4242) - 0.5) * 0.09;
        const col = shade(drain(slab, desat * 0.25), 1 + jit);
        ctx.fillStyle = css(col);
        ctx.beginPath();
        ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = css(shade(col, 0.9), 0.5);
        ctx.lineWidth = 1; ctx.stroke();
        // scuffs
        const rn = mulberry32(tx * 8191 + ty * 131);
        if (rn() > 0.65) {
          ctx.fillStyle = css(shade(col, 0.86), 0.4);
          const a = rn(), b = rn();
          ctx.fillRect(x0 + (x1 - x0) * a + (x3 - x0) * b, y0 + (y1 - y0) * a + (y3 - y0) * b, 7, 3);
        }
      }
    }

    // painted safety lanes flanking the belt
    const laneC = drain(hex2rgb(pal.accent), desat * 0.5);
    ctx.strokeStyle = css(laneC, 0.5);
    ctx.lineWidth = 4;
    for (const row of [BELT_ROW - 1.15, BELT_ROW + 1.15]) {
      ctx.beginPath();
      ctx.moveTo(sx_(0.3, row), sy_(0.3, row));
      ctx.lineTo(sx_(FN - 0.3, row), sy_(FN - 0.3, row));
      ctx.stroke();
    }
    // pipe rack along the north edge
    {
      const pipeCols = [[146, 108, 84], [104, 122, 138], [128, 132, 120]];
      for (let k = 0; k < 3; k++) {
        const row = -0.35 - k * 0.16;
        ctx.strokeStyle = css(drain(pipeCols[k], desat * 0.4));
        ctx.lineWidth = 9 - k * 1.4;
        ctx.beginPath();
        ctx.moveTo(sx_(0.2, row), sy_(0.2, row) - 26 - k * 13);
        ctx.lineTo(sx_(FN - 0.2, row), sy_(FN - 0.2, row) - 26 - k * 13);
        ctx.stroke();
        ctx.strokeStyle = css(shade(drain(pipeCols[k], desat * 0.4), 1.4), 0.5);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx_(0.2, row), sy_(0.2, row) - 29 - k * 13);
        ctx.lineTo(sx_(FN - 0.2, row), sy_(FN - 0.2, row) - 29 - k * 13);
        ctx.stroke();
      }
      // pipe stanchions
      ctx.fillStyle = css(shade(slab, 0.55));
      for (let i = 0; i <= 4; i++) {
        const f = i / 4;
        const px = lerp(sx_(0.4, -0.35), sx_(FN - 0.4, -0.35), f);
        const py = lerp(sy_(0.4, -0.35), sy_(FN - 0.4, -0.35), f);
        ctx.fillRect(px - 4, py - 54, 8, 54);
      }
    }
    // control booth in the east corner
    {
      const bx = sx_(FN - 1.3, 0.7), by = sy_(FN - 1.3, 0.7);
      const wallB = drain([160, 148, 132], desat * 0.35);
      Art.isoPrism(ctx, bx, by, 46, 23, 60,
        shade(wallB, 1.06), shade(wallB, 0.98), shade(wallB, 0.7));
      ctx.fillStyle = css(drain([120, 158, 176], desat * 0.4), 0.85);
      ctx.fillRect(bx - 38, by - 78, 34, 24);
      ctx.strokeStyle = css(shade(wallB, 0.6));
      ctx.lineWidth = 2;
      ctx.strokeRect(bx - 38, by - 78, 34, 24);
    }
    // safety railing along the south edge
    {
      ctx.strokeStyle = css(drain(hex2rgb(pal.accent), desat * 0.5), 0.75);
      ctx.lineWidth = 3;
      const y0 = FM + 0.25;
      for (let i = 0; i <= 10; i++) {
        const f = i / 10;
        const px = lerp(sx_(0.2, y0), sx_(FN - 0.2, y0), f);
        const py = lerp(sy_(0.2, y0), sy_(FN - 0.2, y0), f);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 22); ctx.stroke();
      }
      for (const off of [22, 12]) {
        ctx.beginPath();
        ctx.moveTo(sx_(0.2, y0), sy_(0.2, y0) - off);
        ctx.lineTo(sx_(FN - 0.2, y0), sy_(FN - 0.2, y0) - off);
        ctx.stroke();
      }
    }
    // slab skirt so the platform reads as solid
    const skirt = shade(slab, 0.62);
    const sw = [sx_(0, FM), sy_(0, FM)], se = [sx_(FN, FM), sy_(FN, FM)], ne = [sx_(FN, 0), sy_(FN, 0)];
    ctx.fillStyle = css(skirt);
    ctx.beginPath();
    ctx.moveTo(sw[0], sw[1]); ctx.lineTo(se[0], se[1]);
    ctx.lineTo(se[0], se[1] + 16); ctx.lineTo(sw[0], sw[1] + 16);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = css(shade(skirt, 0.78));
    ctx.beginPath();
    ctx.moveTo(se[0], se[1]); ctx.lineTo(ne[0], ne[1]);
    ctx.lineTo(ne[0], ne[1] + 16); ctx.lineTo(se[0], se[1] + 16);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawPile(ctx, x, y, amount, colour, cap) {
    const n = clamp(Math.round(Math.log10(amount + 1) * 8), 0, cap || 30);
    if (!n) return;
    G.dropShadow(ctx, x, y + 3, 40, 12, 0.32);
    const rn = mulberry32(1337);
    for (let i = 0; i < n; i++) {
      const t = i / Math.max(1, n);
      const px = x + (rn() - 0.5) * 52 * (1 - t * 0.6);
      const py = y - t * 22;
      Art.blob(ctx, px, py, 7.6, 4.6, shade(colour, 0.9 + rn() * 0.3), 0.7);
    }
  }

  function draw(ctx, W, H, state, t, opts) {
    const v = state.visual;
    const product = PD.PRODUCTS[state.product];
    const pal = product.palette;
    const rm = !!opts.reducedMotion;
    const dt = Math.min(0.05, opts.dt || 0.016);
    const day = v.day;
    const warm = v.floorWarmth;
    const nightAmt = clamp01(1 - day.light * 1.5);

    cam.update(dt, rm);

    /* sky backdrop — the same weather as outside, seen over the slab */
    const skyBase = mix(hex2rgb(pal.sky), hex2rgb(pal.skyDecay), v.skyDrift);
    const top = mix([28, 34, 56], skyBase, clamp01(day.light * 1.25));
    const bot = mix([46, 50, 72], mix(skyBase, [240, 230, 206], 0.5), clamp01(day.light * 1.3));
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, css(top)); g.addColorStop(1, css(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const key = [Math.round(warm * 8), Math.round(v.desat * 10), state.product].join('|');
    const fCv = layer.get(key, (WORLD_W * SS) | 0, (WORLD_H * SS) | 0,
      (c, w, h) => buildFloor(c, w, h, { warm, desat: v.desat, pal }));

    const base = Math.min(W / (WORLD_W * 0.80), H / (WORLD_H * 0.80));
    const S = base * cam.zoom;
    const tx = W / 2 + cam.shakeX - (WORLD_W / 2 - cam.x) * S;
    const ty = H / 2 + cam.shakeY - (WORLD_H / 2 - cam.y) * S;

    ctx.save();
    ctx.setTransform(S, 0, 0, S, tx, ty);
    ctx.drawImage(fCv, 0, 0, WORLD_W, WORLD_H);

    const showRef = clamp(v.refLines, 0, 6);
    const showAsm = clamp(v.asmLines, 0, 6);
    // A station is starved when the stage feeding it cannot keep up — that is
    // the real bottleneck, and every number behind it is one the player sees.
    const rr = v.rates;
    const rawFed = state.resources.raw > 0.5 || rr.dig >= rr.refine * 0.98;
    const refFed = state.resources.refined > 0.5 || rr.refine >= rr.assemble * 0.98;
    const furnaceStarved = rr.dig < rr.refine * 0.9 && state.resources.raw < 1;
    const pressStarved = rr.refine < rr.assemble * 0.9 && state.resources.refined < 1;
    const activity = v.activity;
    const lights = [];
    const decay = v.desat;

    /* ---- the belt: material actually travelling the floor ---- */
    const beltX0 = 0.6, beltX1 = FN - 0.6;
    const targetItems = clamp(Math.round(2 + activity * 26), 0, 34);
    if (!rm) {
      while (belt.length < targetItems) belt.push({ p: Math.random(), lane: Math.random() < 0.5 ? -0.16 : 0.16 });
      while (belt.length > targetItems) belt.pop();
      const speed = 0.06 + activity * 0.22;
      for (const it of belt) {
        it.p += speed * dt;
        if (it.p > 1) it.p -= 1;
      }
    } else if (belt.length !== targetItems) {
      belt = Array.from({ length: targetItems }, (_, i) => ({ p: i / Math.max(1, targetItems), lane: i % 2 ? 0.16 : -0.16 }));
    }

    // belt structure: legs, frame rails, then the running surface
    const bx0 = sx_(beltX0, BELT_ROW), by0 = sy_(beltX0, BELT_ROW);
    const bx1 = sx_(beltX1, BELT_ROW), by1 = sy_(beltX1, BELT_ROW);
    const LEGS = 7;
    for (let i = 0; i <= LEGS; i++) {
      const f = i / LEGS;
      const lx = lerp(bx0, bx1, f), ly = lerp(by0, by1, f);
      G.dropShadow(ctx, lx, ly + 6, 12, 5, 0.3);
      ctx.fillStyle = css(mix([70, 66, 68], [86, 88, 98], 1 - warm));
      ctx.fillRect(lx - 3.5, ly - 16, 7, 20);
    }
    ctx.strokeStyle = css(mix([96, 90, 88], [104, 106, 116], 1 - warm));
    ctx.lineWidth = 22;
    ctx.beginPath(); ctx.moveTo(bx0, by0 - 16); ctx.lineTo(bx1, by1 - 16); ctx.stroke();
    ctx.strokeStyle = css([48, 44, 46]);
    ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(bx0, by0 - 16); ctx.lineTo(bx1, by1 - 16); ctx.stroke();
    ctx.strokeStyle = css(drain(hex2rgb(pal.accent), v.desat * 0.5), 0.75);
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(bx0, by0 - 25); ctx.lineTo(bx1, by1 - 25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx0, by0 - 7); ctx.lineTo(bx1, by1 - 7); ctx.stroke();
    // rollers scrolling
    ctx.strokeStyle = 'rgba(150,146,150,0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 16]);
    ctx.lineDashOffset = rm ? 0 : -t * (40 + activity * 260);
    ctx.beginPath(); ctx.moveTo(bx0, by0 - 16); ctx.lineTo(bx1, by1 - 16); ctx.stroke();
    ctx.setLineDash([]);

    const prodC = drain(hex2rgb(pal.accent), decay * 0.4);
    for (const it of belt) {
      const x = lerp(beltX0, beltX1, it.p);
      const px = sx_(x, BELT_ROW + it.lane), py = sy_(x, BELT_ROW + it.lane) - 23;
      ctx.fillStyle = css(shade(prodC, 0.55), 0.35);
      ctx.beginPath(); ctx.ellipse(px, py + 5, 6, 2.4, 0, 0, 7); ctx.fill();
      ctx.fillStyle = css(prodC);
      G.roundRect(ctx, px - 6, py - 5, 12, 9, 3); ctx.fill();
      ctx.fillStyle = css(shade(prodC, 1.45), 0.85);
      ctx.fillRect(px - 4.4, py - 3.6, 4.5, 2.4);
    }

    /* ---- stations, workers, robots, piles: depth sorted ---- */
    const draws = [];
    for (let i = 0; i < showRef; i++) {
      draws.push({ d: (0.9 + i * 1.9) + REF_ROW, kind: 'furnace', x: 0.9 + i * 1.9, y: REF_ROW, i });
    }
    for (let i = 0; i < showAsm; i++) {
      draws.push({ d: (1.5 + i * 1.9) + ASM_ROW, kind: 'press', x: 1.5 + i * 1.9, y: ASM_ROW, i });
    }
    // crew: robots take the front posts, humans the rest
    const posts = showRef + showAsm;
    let unit = 0;
    const postPos = [];
    for (let i = 0; i < showRef; i++) postPos.push([0.9 + i * 1.9 + 0.86, REF_ROW + 0.9]);
    for (let i = 0; i < showAsm; i++) postPos.push([1.5 + i * 1.9 + 0.86, ASM_ROW + 0.9]);
    const robots = clamp(v.robots, 0, posts);
    const humans = clamp(v.workers, 0, Math.max(0, posts - robots));
    for (const [px, py] of postPos) {
      if (unit < robots) draws.push({ d: px + py + 0.01, kind: 'robot', x: px, y: py, i: unit });
      else if (unit < robots + humans) draws.push({ d: px + py + 0.01, kind: 'worker', x: px, y: py, i: unit });
      unit++;
    }
    draws.push({ d: 0.6 + 7.2, kind: 'rawPile', x: 0.6, y: 7.2 });
    draws.push({ d: 5.4 + 7.4, kind: 'refPile', x: 5.4, y: 7.4 });
    draws.push({ d: 10.4 + 7.2, kind: 'crates', x: 10.4, y: 7.2 });
    draws.sort((a, b) => a.d - b.d);

    for (const it of draws) {
      const px = sx_(it.x, it.y), py = sy_(it.x, it.y);
      if (it.kind === 'furnace' || it.kind === 'press') {
        const isFur = it.kind === 'furnace';
        const cv = Art.get(isFur ? 'furnace' : 'press', 0, decay, pal, state.product);
        const sc = 0.48;
        const fed = isFur ? rawFed : refFed;
        const running = fed && activity > 0.015;
        G.dropShadow(ctx, px + 3, py + 2, cv.width * sc * 0.36, cv.height * sc * 0.09, 0.32);
        Art.draw(ctx, cv, px, py, sc);
        if (isFur) {
          // mouth glow, brighter with throughput
          const mx = px + (cv.mouthX - cv.ax) * sc, my = py + (cv.mouthY - cv.ay) * sc;
          const flick = rm ? 1 : 0.82 + 0.18 * Math.sin(t * 11 + it.i * 2);
          if (running) {
            ctx.fillStyle = `rgba(248,158,64,${0.9 * flick})`;
            G.roundRect(ctx, mx - 7, my - 5, 14, 10, 3); ctx.fill();
            lights.push({ x: mx, y: my, r: 30, c: [255, 150, 60], on: true });
            if (!rm && Math.random() < 0.28) {
              parts.spawn({
                kind: 'spark', x: mx, y: my, vx: (Math.random() - 0.5) * 50, vy: -30 - Math.random() * 50,
                g: 130, life: 0.5 + Math.random() * 0.4, size: 2.6, add: true,
                c: [255, 196, 108], drag: 0.97,
              });
            }
            if (!rm && Math.random() < 0.12 + activity * 0.2) {
              const stx = px + (cv.stackX - cv.ax) * sc, sty = py + (cv.stackY - cv.ay) * sc;
              parts.spawn({
                kind: 'smoke', x: stx, y: sty, vx: 5, vy: -18, g: -3,
                life: 2.6, size: 2.6, c: mix([180, 174, 168], [104, 98, 96], v.haze), drag: 0.995,
              });
            }
          } else {
            ctx.fillStyle = 'rgba(38,32,32,0.92)';
            G.roundRect(ctx, mx - 7, my - 5, 14, 10, 3); ctx.fill();
          }
        } else {
          const hy = py + (cv.headY - cv.ay) * sc;
          const stroke = (running && !rm) ? Math.abs(Math.sin(t * 6 + it.i)) : 0.5;
          ctx.fillStyle = css(mix([120, 118, 128], [92, 94, 104], 1 - warm));
          ctx.fillRect(px - 7, hy + stroke * 14, 14, 20);
          if (running && !rm && stroke > 0.94 && Math.random() < 0.4) {
            parts.spawn({
              kind: 'spark', x: px, y: hy + 26, vx: (Math.random() - 0.5) * 70, vy: -20 - Math.random() * 30,
              g: 150, life: 0.35, size: 2, add: true, c: [255, 226, 170], drag: 0.96,
            });
          }
        }
        // starved marker: a slow amber pulse under a station the line cannot feed
        if ((isFur ? furnaceStarved : pressStarved) && activity > 0.01) {
          const pulse = rm ? 0.5 : 0.4 + 0.35 * Math.sin(t * 3 + it.i);
          ctx.strokeStyle = `rgba(226,150,64,${pulse})`;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(px, py + 3, 22, 11, 0, 0, 7); ctx.stroke();
        }
      } else if (it.kind === 'worker') {
        const cv = Art.get('worker', it.i % 4, decay, pal, state.product);
        const bob = rm ? 0 : Math.abs(Math.sin(t * 3.4 + it.i * 1.7)) * 2.6;
        G.dropShadow(ctx, px + 1, py + 1, cv.width * 0.44 * 0.34, cv.height * 0.44 * 0.08, 0.3);
        Art.draw(ctx, cv, px, py - bob, 0.44);
      } else if (it.kind === 'robot') {
        const cv = Art.get('robot', 0, decay, pal, state.product);
        G.dropShadow(ctx, px + 1, py + 1, cv.width * 0.44 * 0.32, cv.height * 0.44 * 0.08, 0.3);
        ctx.save();
        ctx.translate(px, py);
        const swing = (rm || activity < 0.02) ? 0 : Math.sin(t * 2.4 + it.i) * 0.09;
        ctx.rotate(swing);
        ctx.translate(-px, -py);
        Art.draw(ctx, cv, px, py, 0.44);
        ctx.restore();
        for (const L of cv.lights) {
          lights.push({ x: px + (L.x - cv.ax) * 0.44, y: py + (L.y - cv.ay) * 0.44, r: 22, c: [120, 220, 150], on: true });
        }
      } else if (it.kind === 'rawPile') {
        drawPile(ctx, px, py, state.resources.raw, drain(hex2rgb(pal.rock), decay * 0.3), 30);
      } else if (it.kind === 'refPile') {
        drawPile(ctx, px, py, state.resources.refined, drain(hex2rgb(pal.accent), decay * 0.3), 30);
      } else if (it.kind === 'crates') {
        const n = clamp(Math.round(Math.log10(state.resources.product + 1) * 2.2), 0, 7);
        const cv = Art.get('crate', 0, decay, pal, state.product);
        for (let i = 0; i < n; i++) {
          const cx = px + (i % 3) * 24 - 24, cy = py - Math.floor(i / 3) * 18;
          Art.draw(ctx, cv, cx, cy, 0.36);
        }
      }
    }

    // overflow note when more lines exist than the floor shows
    if (v.refLines > showRef || v.asmLines > showAsm) {
      ctx.fillStyle = 'rgba(232,222,200,0.6)';
      ctx.font = '15px ui-monospace, monospace';
      ctx.fillText(`+${(v.refLines - showRef) + (v.asmLines - showAsm)} more lines running off-floor`,
        sx_(0.4, FM - 0.4), sy_(0.4, FM - 0.4) + 40);
    }

    if (!rm) parts.update(dt);
    parts.draw(ctx);
    ctx.restore();

    /* lights + atmosphere */
    let anyLight = false;
    if (G.perf.level >= 2 || (G.perf.level >= 1 && nightAmt > 0.25)) {
      for (const L of lights) if (L.on) { anyLight = true; break; }
    }
    if (anyLight) {
      const bctx = bloom.begin(W, H);
      bctx.setTransform(S * 0.5, 0, 0, S * 0.5, tx * 0.5, ty * 0.5);
      for (const L of lights) {
        if (!L.on) continue;
        const gg = bctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
        gg.addColorStop(0, css(L.c, 0.9));
        gg.addColorStop(0.4, css(L.c, 0.3));
        gg.addColorStop(1, css(L.c, 0));
        bctx.fillStyle = gg;
        bctx.beginPath(); bctx.arc(L.x, L.y, L.r, 0, 7); bctx.fill();
      }
      bctx.setTransform(1, 0, 0, 1, 0, 0);
      bloom.composite(ctx, W, H, 0.6 + nightAmt * 0.5);
    }

    if (v.haze > 0.02) {
      ctx.fillStyle = `rgba(200,166,126,${Math.min(0.4, v.haze * 0.36)})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (nightAmt > 0.02) G.grade(ctx, W, H, [96, 112, 170], nightAmt * 0.4, [40, 60, 120], nightAmt * 0.28);
    // a cold cast once the floor empties of people
    if (warm < 0.6) G.grade(ctx, W, H, [150, 170, 210], (0.6 - warm) * 0.32, [80, 110, 170], (0.6 - warm) * 0.3);
    G.vignette(ctx, W, H, 0.32 + nightAmt * 0.2, [10, 8, 14]);
    if (G.perf.level >= 2) G.grain(ctx, W, H, 0.06, t * 33, t * 21);
  }

  PD.RenderFactory = { draw, cam, parts, resetView() { cam.reset(); } };
})();

/* ==== src/render_fp.js ==== */
/* Paperclip Drift — the walkthrough.
   Ground level, inside the hall. Nothing to manage here; it exists to be
   looked at. Parallax layers, light shafts from the windows, and an
   occupancy that quietly changes who is standing at the benches.
   Reads state.visual only.                                                  */
'use strict';
var PD = globalThis.PD || (globalThis.PD = {});

(function () {
  const G = PD.Gfx;
  const { css, mix, shade, drain, hex2rgb, hash2, clamp, clamp01, lerp } = G;

  const HALL_W = 3000, HALL_H = 620;
  const BAYS = 9, BAY_W = 290, BAY0 = 150;
  const bloom = new G.Bloom();
  const parts = new G.Particles(320);

  function draw(ctx, W, H, state, t, opts) {
    const v = state.visual;
    const pal = PD.PRODUCTS[state.product].palette;
    const rm = !!opts.reducedMotion;
    const dt = Math.min(0.05, opts.dt || 0.016);
    const scale = H / HALL_H;
    const maxPan = Math.max(0, HALL_W * scale - W);
    const pan = clamp(opts.pan || 0, 0, maxPan);
    const bob = rm ? 0 : Math.sin(t * 1.9) * (opts.walking ? 3.2 : 0.9);

    const day = v.day;
    const warm = v.floorWarmth;
    const nightAmt = clamp01(1 - day.light * 1.5);
    const humans = clamp(v.workers, 0, BAYS);
    const robots = clamp(v.robots, 0, BAYS - humans);
    const lights = [];

    // only the stretch of hall actually on screen is worth drawing
    const viewL = pan / scale - 160, viewR = (pan + W) / scale + 160;
    const visible = (x0, x1) => x1 > viewL && x0 < viewR;

    ctx.save();
    ctx.translate(-pan, bob);
    ctx.scale(scale, scale);

    /* ---- back wall ---- */
    const wallHi = mix([164, 142, 122], [102, 104, 114], 1 - warm);
    const wallLo = mix([118, 100, 86], [78, 80, 90], 1 - warm);
    let g = ctx.createLinearGradient(0, 0, 0, 430);
    g.addColorStop(0, css(shade(wallHi, 0.86)));
    g.addColorStop(0.45, css(wallHi));
    g.addColorStop(1, css(wallLo));
    ctx.fillStyle = g;
    ctx.fillRect(-200, -60, HALL_W + 400, 490);
    // brick courses
    ctx.strokeStyle = css(shade(wallLo, 0.9), 0.25);
    ctx.lineWidth = 1.5;
    for (let y = 20; y < 430; y += 26) {
      ctx.beginPath(); ctx.moveTo(-200, y); ctx.lineTo(HALL_W + 200, y); ctx.stroke();
    }

    /* ---- windows: the outside world, drifting ---- */
    const skyBase = mix(hex2rgb(pal.sky), hex2rgb(pal.skyDecay), v.skyDrift);
    const sky = mix(mix([30, 36, 60], skyBase, clamp01(day.light * 1.3)),
      [232, 168, 118], clamp01(1 - Math.abs(day.elev + 0.02) * 3.2) * 0.5);
    const scar = v.sites[0] ? v.sites[0].scar : 0;
    for (let i = 0; i < BAYS + 1; i++) {
      const wx = 70 + i * BAY_W;
      if (!visible(wx, wx + 128)) continue;
      const wg = ctx.createLinearGradient(0, 55, 0, 190);
      wg.addColorStop(0, css(sky));
      wg.addColorStop(1, css(mix(sky, [228, 216, 194], 0.45 * day.light)));
      ctx.fillStyle = wg;
      ctx.fillRect(wx, 55, 128, 135);
      // hills and the working face beyond
      const hill = mix(mix(hex2rgb(pal.grass), hex2rgb(pal.grassDecay), v.desat), sky, 0.2);
      ctx.fillStyle = css(hill);
      ctx.beginPath();
      ctx.moveTo(wx, 190);
      ctx.quadraticCurveTo(wx + 64, 190 - 46 * (1 - scar * 0.75), wx + 128, 190);
      ctx.closePath(); ctx.fill();
      if (scar > 0.1) {
        ctx.fillStyle = css(shade(hex2rgb(pal.pit), 0.92), 0.9);
        ctx.beginPath();
        ctx.ellipse(wx + 64, 188, 42 * scar, 8 + 6 * scar, 0, 0, 7);
        ctx.fill();
      }
      if (v.haze > 0.05) {
        ctx.fillStyle = `rgba(202,168,124,${v.haze * 0.45})`;
        ctx.fillRect(wx, 55, 128, 135);
      }
      if (nightAmt > 0.3) {
        ctx.fillStyle = `rgba(20,26,48,${nightAmt * 0.45})`;
        ctx.fillRect(wx, 55, 128, 135);
      }
      // frame
      ctx.strokeStyle = css(shade(wallLo, 0.75));
      ctx.lineWidth = 7;
      ctx.strokeRect(wx, 55, 128, 135);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(wx + 64, 55); ctx.lineTo(wx + 64, 190);
      ctx.moveTo(wx, 122); ctx.lineTo(wx + 128, 122);
      ctx.stroke();
      // daylight shaft on the floor
      if (day.light > 0.35) {
        const sg = ctx.createLinearGradient(wx + 64, 190, wx + 130, 470);
        sg.addColorStop(0, `rgba(255,240,206,${0.16 * day.light})`);
        sg.addColorStop(1, 'rgba(255,240,206,0)');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.moveTo(wx + 6, 190); ctx.lineTo(wx + 122, 190);
        ctx.lineTo(wx + 190, 470); ctx.lineTo(wx + 40, 470);
        ctx.closePath(); ctx.fill();
      }
    }

    /* ---- floor ---- */
    g = ctx.createLinearGradient(0, 430, 0, HALL_H);
    g.addColorStop(0, css(mix([112, 100, 92], [88, 90, 100], 1 - warm)));
    g.addColorStop(1, css(mix([70, 62, 58], [54, 56, 66], 1 - warm)));
    ctx.fillStyle = g;
    ctx.fillRect(-200, 430, HALL_W + 400, HALL_H - 430 + 40);
    ctx.strokeStyle = 'rgba(38,34,36,0.45)';
    ctx.lineWidth = 2.5;
    for (let i = -2; i < 34; i++) {
      const fx = i * 105;
      ctx.beginPath(); ctx.moveTo(fx, 430); ctx.lineTo(fx - 90, HALL_H + 40); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(38,34,36,0.28)';
    ctx.lineWidth = 2;
    for (const yy of [470, 520, 580]) {
      ctx.beginPath(); ctx.moveTo(-200, yy); ctx.lineTo(HALL_W + 200, yy); ctx.stroke();
    }

    /* ---- bays ---- */
    for (let i = 0; i < BAYS; i++) {
      const bx = BAY0 + i * BAY_W;
      if (!visible(bx - 30, bx + 250)) continue;
      const occ = i < robots ? 'robot' : (i < robots + humans ? 'human' : 'empty');
      drawBay(ctx, bx, t + i * 1.7, occ, warm, rm, v, lights, nightAmt);
    }

    /* ---- the end room ---- */
    if (visible(HALL_W - 380, HALL_W - 50)) drawEndRoom(ctx, HALL_W - 380, t, v, warm, rm, lights);

    /* ---- ceiling trusses + hanging lamps (parallax above) ---- */
    ctx.save();
    ctx.translate(pan * 0.10, 0);
    ctx.strokeStyle = css(shade(wallLo, 0.6), 0.9);
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(-200, -6); ctx.lineTo(HALL_W + 200, -6);
    ctx.stroke();
    for (let i = 0; i < BAYS + 2; i++) {
      const bx = 60 + i * BAY_W;
      if (!visible(bx - pan * 0.10 - 20, bx - pan * 0.10 + 140)) continue;
      ctx.strokeStyle = css(shade(wallLo, 0.55), 0.85);
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(bx, -6); ctx.lineTo(bx + 60, 44); ctx.lineTo(bx + 120, -6);
      ctx.moveTo(bx + 60, 44); ctx.lineTo(bx + 60, -6);
      ctx.stroke();
    }
    ctx.restore();

    /* ---- foreground pillars, closest layer ---- */
    ctx.save();
    ctx.translate(-pan * 0.34, 0);
    for (let i = 0; i < 7; i++) {
      const px = 240 + i * 520;
      if (!visible(px + pan * 0.34 - 30, px + pan * 0.34 + 74)) continue;
      const pg = ctx.createLinearGradient(px, 0, px + 44, 0);
      pg.addColorStop(0, css(shade(wallLo, 0.5)));
      pg.addColorStop(0.4, css(shade(wallLo, 0.78)));
      pg.addColorStop(1, css(shade(wallLo, 0.42)));
      ctx.fillStyle = pg;
      ctx.fillRect(px, -70, 44, HALL_H + 120);
      ctx.fillStyle = css(shade(wallLo, 0.4), 0.5);
      ctx.fillRect(px - 10, -70, 64, 22);
    }
    ctx.restore();

    /* ---- airborne dust in the light ---- */
    if (!rm) {
      if (Math.random() < 0.5) {
        parts.spawn({
          kind: 'dot', x: pan / scale + Math.random() * (W / scale), y: 180 + Math.random() * 300,
          vx: (Math.random() - 0.5) * 8, vy: -2 - Math.random() * 5, g: 1.5,
          life: 4 + Math.random() * 3, size: 1.5, add: true,
          c: mix([255, 238, 200], [150, 170, 220], nightAmt), drag: 0.999,
        });
      }
      parts.update(dt);
    }
    parts.draw(ctx);

    ctx.restore();

    /* ---- lights ---- */
    if (lights.length && (G.perf.level >= 2 || nightAmt > 0.25)) {
      const bctx = bloom.begin(W, H);
      bctx.setTransform(scale * 0.5, 0, 0, scale * 0.5, -pan * 0.5, bob * 0.5);
      for (const L of lights) {
        if (!L.on) continue;
        const gg = bctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
        gg.addColorStop(0, css(L.c, 0.85));
        gg.addColorStop(0.4, css(L.c, 0.28));
        gg.addColorStop(1, css(L.c, 0));
        bctx.fillStyle = gg;
        bctx.beginPath(); bctx.arc(L.x, L.y, L.r, 0, 7); bctx.fill();
      }
      bctx.setTransform(1, 0, 0, 1, 0, 0);
      bloom.composite(ctx, W, H, 0.55 + nightAmt * 0.55);
    }

    /* ---- atmosphere ---- */
    if (v.haze > 0.03) {
      ctx.fillStyle = `rgba(198,168,130,${Math.min(0.34, v.haze * 0.3)})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (warm < 0.62) G.grade(ctx, W, H, [140, 164, 210], (0.62 - warm) * 0.42, [70, 100, 165], (0.62 - warm) * 0.34);
    else G.grade(ctx, W, H, [255, 226, 186], 0.12, [255, 196, 130], 0.14);
    if (nightAmt > 0.02) G.grade(ctx, W, H, [96, 112, 170], nightAmt * 0.3, [40, 60, 120], nightAmt * 0.2);
    G.vignette(ctx, W, H, 0.42, [8, 6, 10]);
    if (G.perf.level >= 2) G.grain(ctx, W, H, 0.07, t * 51, t * 37);

    return maxPan;
  }

  function drawBay(ctx, bx, t, occ, warm, rm, v, lights, nightAmt) {
    const lampWarm = occ === 'human';
    const lampOn = occ !== 'empty' || warm > 0.7 || nightAmt > 0.3;
