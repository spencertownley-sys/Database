services:
  postgres:
    image: postgres:16-alpine
    container_name: strata-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strata
    ports:
      - '5432:5432'
    volumes:
      - strata-pgdata:/var/lib/postgresql/data
      # ltree and pg_trgm are load-bearing: ltree backs both hierarchies,
      # pg_trgm backs item search. Create them before the first migration.
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d strata']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: strata-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  strata-pgdata:
